name: Release Multi-Platform Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag name (e.g. v0.1.0)'
        required: true
        default: 'v0.1.0'

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }} - ${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: zen-design-server
            raw_binary_name: zen-design-linux-x86_64
            archive_name: zen-design-linux-x86_64.tar.gz
            is_windows: false
            is_macos: false
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: zen-design-server.exe
            raw_binary_name: zen-design-windows-x86_64.exe
            archive_name: zen-design-windows-x86_64.zip
            is_windows: true
            is_macos: false
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: zen-design-server
            raw_binary_name: zen-design-macos-arm64
            archive_name: zen-design-macos-arm64.tar.gz
            dmg_name: zen-design-macos-arm64.dmg
            is_windows: false
            is_macos: true
          - os: macos-13
            target: x86_64-apple-darwin
            artifact_name: zen-design-server
            raw_binary_name: zen-design-macos-x86_64
            archive_name: zen-design-macos-x86_64.tar.gz
            dmg_name: zen-design-macos-x86_64.dmg
            is_windows: false
            is_macos: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown, ${{ matrix.target }}

      - name: Install Trunk
        uses: taiki-e/install-action@v2
        with:
          tool: trunk

      - name: Build Studio (WASM)
        run: |
          cd studio
          trunk build --release

      - name: Build Server (Self-contained with embedded Studio)
        run: |
          cd server
          cargo build --release --target ${{ matrix.target }}

      - name: Prepare Standalone Binary
        shell: bash
        run: |
          mkdir -p release_assets
          cp server/target/${{ matrix.target }}/release/${{ matrix.artifact_name }} release_assets/${{ matrix.raw_binary_name }}

      - name: Package Unix Archive (.tar.gz)
        if: "!matrix.is_windows"
        run: |
          mkdir -p pkg/workspace
          cp server/target/${{ matrix.target }}/release/${{ matrix.artifact_name }} pkg/
          cp -r studio/dist pkg/
          cp workspace/index.html pkg/workspace/
          cp README.md LICENSE pkg/
          tar -czvf release_assets/${{ matrix.archive_name }} -C pkg .

      - name: Package macOS DMG Image (.dmg)
        if: matrix.is_macos
        run: |
          mkdir -p dmg_folder
          cp server/target/${{ matrix.target }}/release/${{ matrix.artifact_name }} dmg_folder/
          cp README.md LICENSE dmg_folder/
          hdiutil create -volname "ZenDesign" -srcfolder dmg_folder -ov -format UDZO release_assets/${{ matrix.dmg_name }}

      - name: Package Windows ZIP (.zip)
        if: matrix.is_windows
        shell: bash
        run: |
          mkdir -p pkg_win/workspace
          cp server/target/${{ matrix.target }}/release/${{ matrix.artifact_name }} pkg_win/
          cp -r studio/dist pkg_win/
          cp workspace/index.html pkg_win/workspace/
          cp README.md LICENSE pkg_win/
          7z a release_assets/${{ matrix.archive_name }} ./pkg_win/*

      - name: Upload Assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || inputs.tag_name }}
          files: release_assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
