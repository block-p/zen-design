<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Job Collector — Motion</title>
<style>
/* ---------- tokens ---------- */
:root{
  --bg:#0d0e12; --tx:#f3f4f6; --ac:#5e6ad2; --card:#161822; --bd:#2b2d3d;
  --mut:color-mix(in srgb, var(--tx) 62%, transparent);
  --lai:cubic-bezier(0.16,1,0.3,1);
  --lei:cubic-bezier(0.7,0,0.84,0);
  --T:10.8s;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:var(--bg)}
body{font-family:system-ui,-apple-system,sans-serif;color:var(--tx);-webkit-font-smoothing:antialiased}
#stage{position:fixed;left:50%;top:50%;width:1440px;height:900px;transform:translate(-50%,-50%) scale(var(--s,1));background:var(--bg);border:1px solid var(--bd);overflow:hidden;user-select:none}
svg{display:block}

/* ---------- shared clock ---------- */
.an{animation-name:none;animation-duration:var(--T);animation-timing-function:linear;animation-iteration-count:infinite;animation-fill-mode:both}
#stage.paused *{animation-play-state:paused!important}

/* ---------- ambient ---------- */
.dots{position:absolute;inset:0;background-image:radial-gradient(color-mix(in srgb,var(--tx) 3%,transparent) 1px,transparent 1.3px);background-size:30px 30px}
.glide{position:absolute;top:0;height:100%;width:1px;background:color-mix(in srgb,var(--tx) 7%,transparent);animation:kDrift var(--T) linear infinite}

/* ---------- beat 1 : chaos ---------- */
.b1wrap{position:absolute;inset:0;animation:kG1 var(--T) linear infinite}
.dl{font-weight:800;line-height:.95;letter-spacing:-.035em}
.l1mk{position:absolute;left:64px;top:206px;overflow:hidden}
.l1g{display:block;position:relative;font-size:148px;white-space:nowrap;animation:kL1x var(--T) linear infinite}
.l1o{color:transparent;-webkit-text-stroke:1.6px color-mix(in srgb,var(--tx) 92%,transparent)}
.l1fc{position:absolute;inset:0;white-space:nowrap;animation:kFill var(--T) linear infinite}
.l1f{color:var(--tx)}
.l2mk{position:absolute;left:64px;top:382px;overflow:hidden}
.l2in{display:block;font-size:156px;color:var(--tx);white-space:nowrap;animation:kL2 var(--T) linear infinite}
.rule{position:absolute;left:64px;top:600px;width:640px;height:1px;background:var(--bd);transform-origin:left center;animation:kRule var(--T) linear infinite}
.numrow{position:absolute;left:64px;top:634px;display:flex;align-items:flex-end;gap:26px;animation:kNum var(--T) linear infinite}
.numrow b{font-size:176px;font-weight:800;letter-spacing:-.04em;color:var(--ac);line-height:.85;font-variant-numeric:tabular-nums}
.numrow i{font-style:normal;font-size:21px;font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:var(--mut);padding-bottom:10px}

.chip{position:absolute;list-style:none}
.cop,.cmv{display:block;width:100%;height:100%;opacity:0}
.cbx{display:block;width:150px;height:40px;border-radius:10px;background:var(--card);border:1px solid var(--bd);position:relative;transform:rotate(var(--fr))}
.cbx em{position:absolute;left:12px;top:16px;width:8px;height:8px;border-radius:50%;background:var(--cd,var(--ac))}
.cbx u{position:absolute;left:30px;top:12px;width:46px;height:5px;border-radius:3px;background:color-mix(in srgb,var(--tx) 26%,transparent);text-decoration:none}
.cbx s{position:absolute;left:30px;top:23px;width:28px;height:5px;border-radius:3px;background:color-mix(in srgb,var(--tx) 15%,transparent);text-decoration:none}
.cmv{width:100%;height:100%;animation:kCmv var(--T) linear infinite}
.cop{width:100%;height:100%;animation:kChipOp var(--T) linear infinite;animation-delay:var(--d)}

.nf{position:absolute;width:158px;height:46px;border-radius:12px;background:var(--card);border:1px solid var(--bd);opacity:0;animation:kNf var(--T) linear infinite;animation-delay:var(--d)}
.nf em{position:absolute;left:12px;top:19px;width:8px;height:8px;border-radius:50%;background:var(--cd,var(--ac))}
.nf u{position:absolute;left:30px;top:15px;width:64px;height:5px;border-radius:3px;background:color-mix(in srgb,var(--tx) 30%,transparent);text-decoration:none}
.nf s{position:absolute;left:30px;top:27px;width:40px;height:5px;border-radius:3px;background:color-mix(in srgb,var(--tx) 15%,transparent);text-decoration:none}

/* ---------- beat 2 : node + wordmark ---------- */
.b2g{position:absolute;inset:0;animation:kG2 var(--T) linear infinite}
.nd{position:absolute;left:711px;top:441px;width:18px;height:18px;border-radius:50%;background:var(--ac);animation:kNode var(--T) linear infinite}
.rg{position:absolute;border-radius:50%;border:1.5px solid color-mix(in srgb,var(--ac) 40%,transparent)}
.rg1{left:624px;top:354px;width:192px;height:192px;animation:kR1 var(--T) linear infinite}
.rg2{left:580px;top:310px;width:280px;height:280px;border-color:color-mix(in srgb,var(--ac) 28%,transparent);animation:kR2 var(--T) linear infinite}
.wm{position:absolute;left:0;right:0;top:372px;text-align:center}
.wm-t{font-weight:800;font-size:118px;line-height:1.02;letter-spacing:.34em;animation:kTrk var(--T) linear infinite}
.wlo{display:inline-block;overflow:hidden;vertical-align:top}
.wl{display:inline-block;opacity:0;animation:kLtr var(--T) linear infinite;animation-delay:calc(2.84s + var(--i)*0.042s)}
.sp{display:inline-block;width:.42em}
.submk{position:absolute;left:0;right:0;top:560px;text-align:center;overflow:hidden}
.subin{display:inline-block;font-size:30px;font-weight:500;color:var(--mut);letter-spacing:.01em;animation:kSub var(--T) linear infinite}

/* ---------- beat 3 : dashboard ---------- */
.g3b{position:absolute;inset:0;animation:kG3 var(--T) linear infinite}
#panel{position:absolute;left:360px;top:170px;width:720px;height:580px;border-radius:26px;background:var(--card);border:1px solid var(--bd);animation:kPanel var(--T) linear infinite}
.hd{position:absolute;left:44px;top:36px;right:44px;display:flex;align-items:center;gap:12px;animation:kHd var(--T) linear infinite}
.hd em{width:8px;height:8px;border-radius:50%;background:var(--ac)}
.hd u{flex:1;height:1px;background:var(--bd);text-decoration:none}
.hd s{display:flex;gap:5px;text-decoration:none}
.hd s u,.hd s s{width:14px;height:4px;border-radius:2px;background:color-mix(in srgb,var(--tx) 22%,transparent)}
.srch{position:absolute;left:44px;top:92px;width:632px;height:76px;border-radius:16px;background:color-mix(in srgb,var(--bg) 72%,var(--card));border:1px solid var(--bd);display:flex;align-items:center;padding-left:56px;animation:kSearch var(--T) linear infinite}
.srch svg{position:absolute;left:20px;top:28px}
#q{font-size:30px;font-weight:600;letter-spacing:.01em;color:var(--tx);font-variant-numeric:tabular-nums;white-space:nowrap}
.crt{display:block;margin-left:3px;animation:kCaret var(--T) linear infinite}
.crt b{display:block;width:2px;height:36px;background:var(--ac);animation:kBlink .72s ease-in-out infinite}
.tags{position:absolute;left:44px;top:194px;display:flex;gap:12px}
.tag{display:inline-block;padding:9px 20px;border-radius:999px;border:1px solid var(--bd);font-size:21px;font-weight:600;color:var(--tx);opacity:0;animation:kTag var(--T) linear infinite;animation-delay:calc(6.30s + var(--i)*0.055s)}
.tag.hl{color:color-mix(in srgb,var(--ac) 65%,var(--tx));border-color:color-mix(in srgb,var(--ac) 45%,var(--bd))}
.cnt{position:absolute;left:44px;top:282px;animation:kCnt var(--T) linear infinite}
.cnt b{font-size:94px;font-weight:800;letter-spacing:-.03em;color:var(--ac);line-height:.95;font-variant-numeric:tabular-nums}
.cnt i{display:block;font-style:normal;font-size:21px;font-weight:500;color:var(--mut);margin-top:10px;letter-spacing:.06em}
.crd{position:absolute;top:444px;width:286px;height:92px;border-radius:14px;background:color-mix(in srgb,var(--card) 82%,var(--tx) 4%);border:1px solid var(--bd)}
.ce{left:44px;animation:kCardA var(--T) linear infinite}
.ce em{position:absolute;left:16px;top:20px;width:7px;height:7px;border-radius:50%;background:var(--ac)}
.ce u{position:absolute;left:34px;top:16px;font-size:23px;font-weight:600;text-decoration:none;color:var(--tx)}
.ce s{position:absolute;left:34px;top:58px;width:110px;height:5px;border-radius:3px;background:color-mix(in srgb,var(--tx) 14%,transparent);text-decoration:none}
.cp{right:44px;text-align:right;padding:16px 18px;animation:kCardB var(--T) linear infinite}
.cp u{display:block;font-size:23px;font-weight:600;text-decoration:none;color:var(--tx)}
.cp .r2{display:flex;justify-content:flex-end;align-items:center;gap:10px;margin-top:10px}
.cp .r2 s{font-size:20px;font-weight:500;color:var(--mut);text-decoration:none}
.cp .pill{font-size:17px;font-weight:600;padding:4px 12px;border-radius:999px;background:color-mix(in srgb,var(--ac) 16%,transparent);color:color-mix(in srgb,var(--ac) 60%,var(--tx))}
.web{position:absolute;inset:0;pointer-events:none}
.wp{fill:none;stroke:color-mix(in srgb,var(--ac) 65%,transparent);stroke-width:1.6;stroke-dasharray:1;opacity:0;animation:kWebD var(--T) linear infinite;animation-delay:calc(5.66s + var(--i)*0.14s)}
.sat{position:absolute;width:44px;height:44px;border-radius:12px;background:var(--card);border:1px solid var(--bd);display:flex;align-items:center;justify-content:center;opacity:0;animation:kSatIn var(--T) linear infinite;animation-delay:calc(5.50s + var(--i)*0.09s)}
.trv{position:absolute;left:0;top:0;width:7px;height:7px;border-radius:50%;background:var(--tx);opacity:0;animation:kTrv var(--T) linear infinite;animation-delay:var(--d)}
@supports not (offset-path:path("M0 0")){.trv{display:none}}

/* ---------- beat 4 : emblem outro ---------- */
.b4g{position:absolute;inset:0;animation:kG4 var(--T) linear infinite}
.em{position:absolute;left:604px;top:118px}
.em .ec{fill:none;stroke:color-mix(in srgb,var(--tx) 32%,transparent);stroke-width:1.5;stroke-dasharray:1;opacity:0;animation:kEnC var(--T) linear infinite}
.em .es{fill:none;stroke:color-mix(in srgb,var(--ac) 85%,var(--tx));stroke-width:2;stroke-linecap:round;stroke-dasharray:1;opacity:0;animation:kEnS var(--T) linear infinite;animation-delay:calc(8.12s + var(--i)*0.11s)}
.em .ed{fill:var(--ac);opacity:0;animation:kEd var(--T) linear infinite;transform-box:fill-box;transform-origin:center}
.em .slt{fill:none;stroke:color-mix(in srgb,var(--tx) 35%,transparent);stroke-width:1.5;stroke-dasharray:1;opacity:0;animation:kSlot var(--T) linear infinite}
.blk{offset-path:path("M 211 36 C 252 128, 196 214, 116 180");offset-distance:100%;animation:kBlk var(--T) linear infinite}
.strw{position:absolute;left:50%;top:398px;transform:translateX(-50%);width:178px;height:26px;overflow:hidden}
.st{position:absolute;top:1px;opacity:0;animation:kStX var(--T) linear infinite;animation-delay:calc(9.02s + var(--i)*0.055s)}
.st path{fill:color-mix(in srgb,var(--ac) 62%,var(--tx))}
.shn{position:absolute;left:0;top:0;width:2px;height:26px;background:color-mix(in srgb,var(--tx) 55%,transparent);opacity:0;animation:kSheen var(--T) linear infinite}
.words{position:absolute;left:0;right:0;top:452px;text-align:center}
.wmk{overflow:hidden;margin:0 auto 2px}
.win{display:inline-block;font-weight:800;font-size:104px;line-height:1.02;letter-spacing:-.03em;color:var(--tx);opacity:0;transform:translateY(108%);animation:kW1 var(--T) linear infinite}
.win.w2{animation-name:kW2}
.win.w3{animation-name:kW3,kOpen;letter-spacing:.17em}
.cmp{position:absolute;left:0;right:0;top:792px;text-align:center;font-size:16px;font-weight:600;letter-spacing:.38em;color:color-mix(in srgb,var(--tx) 34%,transparent);opacity:0;animation:kCmp var(--T) linear infinite}

/* ---------- chrome ---------- */
#ui{position:absolute;right:22px;top:20px;display:flex;gap:8px;z-index:9}
#ui button{width:30px;height:30px;border:0;background:transparent;color:color-mix(in srgb,var(--tx) 42%,transparent);cursor:pointer;padding:5px}
#ui button:hover{color:color-mix(in srgb,var(--tx) 78%,transparent)}
#ui svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round}
#ui .iP{display:none}
#stage.paused .iP{display:block}
#stage.paused .iPa{display:none}
.iPa,.iP{fill:currentColor;stroke:none}
#pgw{position:absolute;left:64px;right:64px;bottom:20px;height:2px;background:color-mix(in srgb,var(--bd) 55%,transparent);z-index:9}
#pg{position:absolute;inset:0;background:color-mix(in srgb,var(--tx) 38%,transparent);transform:scaleX(0);transform-origin:left center;animation:kPg var(--T) linear infinite}

/* ---------- keyframes (all share one 10.8s clock) ---------- */
@keyframes kDrift{0%{transform:translateX(240px)}100%{transform:translateX(1240px)}}
@keyframes kPg{0%{transform:scaleX(0)}100%{transform:scaleX(1)}}
/* gates */
@keyframes kG1{0%{opacity:1}22.9%{opacity:1}23.9%{opacity:0}}
@keyframes kG2{0%{opacity:0;transform:scale(1)}24.2%{opacity:0;transform:scale(1)}24.9%{opacity:1;transform:scale(1)}44.2%{opacity:1;transform:scale(1)}47.2%{opacity:0;transform:scale(2.55)}}
@keyframes kG3{0%{opacity:0}46.9%{opacity:0}47.4%{opacity:1}72.4%{opacity:1}73.4%{opacity:0}}
@keyframes kG4{0%{opacity:0}73.0%{opacity:0}73.6%{opacity:1}97.2%{opacity:1}99.3%{opacity:0}}
/* beat 1 */
@keyframes kFill{0%{clip-path:inset(0 100% 0 0)}2.4%{clip-path:inset(0 100% 0 0)}8.8%{clip-path:inset(0 0 0 0)}}
@keyframes kL2{0%{opacity:0;transform:translateY(112%)}4.8%{opacity:1;transform:none;animation-timing-function:var(--eo)}4.81%{animation-timing-function:linear}21.2%{opacity:1;transform:none;animation-timing-function:var(--ei)}23.6%{opacity:0;transform:translateY(-115%)}}
@keyframes kL1x{0%{transform:none;opacity:1}21.4%{transform:none;opacity:1;animation-timing-function:var(--ei)}23.7%{transform:translateY(-115%);opacity:0}}
@keyframes kRule{0%{transform:scaleX(0);opacity:0}6.5%{transform:scaleX(0);opacity:0;animation-timing-function:var(--eo)}6.51%{animation-timing-function:linear}10.6%{transform:scaleX(1);opacity:1}21.2%{transform:scaleX(1);opacity:1;animation-timing-function:linear}23%{opacity:0}}
@keyframes kNum{0%{opacity:0;transform:translateY(34px)}5%{opacity:0;transform:translateY(34px);animation-timing-function:var(--eo)}5.01%{animation-timing-function:linear}8.6%{opacity:1;transform:none}21.2%{opacity:1;transform:none;animation-timing-function:var(--ei)}23.2%{opacity:0;transform:translateY(-30px)}}
@keyframes kChipOp{0%{opacity:0}4.4%{opacity:1}}
@keyframes kCmv{0%{transform:translate(var(--fx),var(--fy)) rotate(var(--fr)) scale(.72);animation-timing-function:var(--eo)}5%{transform:none}20%{transform:none;animation-timing-function:var(--ei)}23.2%{transform:translate(var(--ix),var(--iy)) scale(.26) rotate(10deg)}}
@keyframes kNf{0%{opacity:0;transform:translateY(var(--ny,16px)) scale(.72);animation-timing-function:var(--eo)}3.8%{opacity:1;transform:none}9%{transform:translateY(-6px)}20%{transform:translateY(-6px);opacity:1;animation-timing-function:var(--ei)}22%{opacity:0;transform:translateY(-2px) scale(1.12)}}
/* beat 2 */
@keyframes kNode{0%{opacity:0;transform:scale(.2)}24.5%{opacity:0;transform:scale(.2);animation-timing-function:var(--eo)}24.51%{animation-timing-function:linear}26.4%{opacity:1;transform:scale(1.08)}27.2%{transform:scale(1)}}
@keyframes kR1{0%{opacity:0;transform:scale(.5)}25.6%{opacity:.45;transform:scale(.55)}30.6%{opacity:0;transform:scale(1.65)}30.7%{opacity:0}}
@keyframes kR2{0%{opacity:0;transform:scale(.5)}27.6%{opacity:.35;transform:scale(.55)}33%{opacity:0;transform:scale(1.65)}33.6%{opacity:.3;transform:scale(.6)}38.4%{opacity:0;transform:scale(1.6)}38.5%{opacity:0}}
@keyframes kTrk{0%{letter-spacing:.34em}26.4%{letter-spacing:.34em;animation-timing-function:var(--eo)}26.41%{animation-timing-function:linear}31.8%{letter-spacing:.02em}}
@keyframes kLtr{0%{opacity:0;transform:translateY(118%);animation-timing-function:var(--eo)}6.2%{opacity:1;transform:none}}
@keyframes kSub{0%{opacity:0;transform:translateY(110%)}35.4%{opacity:0;transform:translateY(110%);animation-timing-function:var(--eo)}35.41%{animation-timing-function:linear}38.6%{opacity:1;transform:none}}
/* beat 3 */
@keyframes kPanel{0%{opacity:0;transform:scale(.97);clip-path:inset(0 0 100% 0)}46.8%{opacity:0;transform:scale(.97);clip-path:inset(0 0 100% 0);animation-timing-function:var(--eo)}46.81%{animation-timing-function:linear}50.6%{opacity:1;transform:none;clip-path:inset(0 0 0 0)}71.2%{opacity:1;clip-path:inset(0 0 0 0);animation-timing-function:var(--eo)}71.21%{animation-timing-function:var(--ei)}73%{opacity:1;clip-path:inset(100% 0 0 0)}73.4%{opacity:0}}
@keyframes kHd{0%{opacity:0;transform:translateY(-12px)}48.2%{opacity:0;transform:translateY(-12px);animation-timing-function:var(--eo)}48.21%{animation-timing-function:linear}51%{opacity:1;transform:none}}
@keyframes kSearch{0%{opacity:0;transform:translateY(14px)}49%{opacity:0;transform:translateY(14px);animation-timing-function:var(--eo)}49.01%{animation-timing-function:linear}52.4%{opacity:1;transform:none}}
@keyframes kCaret{0%{opacity:0}52%{opacity:0}52.4%{opacity:1}57.2%{opacity:1}57.8%{opacity:0}}
@keyframes kBlink{0%{opacity:.95}50%{opacity:.15}100%{opacity:.95}}
@keyframes kTag{0%{opacity:0;transform:translateY(12px) scale(.86);animation-timing-function:var(--eo)}4%{opacity:1;transform:none}}
@keyframes kSatIn{0%{opacity:0;transform:scale(.6)}3.4%{opacity:1;transform:scale(1);animation-timing-function:var(--eo)}3.41%{animation-timing-function:linear}}
@keyframes kWebD{0%{opacity:0;stroke-dashoffset:1}5.5%{opacity:1;stroke-dashoffset:0;animation-timing-function:var(--eo)}5.51%{animation-timing-function:linear}}
@keyframes kTrv{0%{offset-distance:0;opacity:0;animation-timing-function:cubic-bezier(.45,.05,.55,.95)}0.9%{opacity:.92}6.5%{offset-distance:100%;opacity:.92;animation-timing-function:linear}6.51%{animation-timing-function:linear}7.4%{opacity:0}}
@keyframes kCnt{0%{opacity:0;transform:translateY(16px)}57%{opacity:0;transform:translateY(16px);animation-timing-function:var(--eo)}57.01%{animation-timing-function:linear}60.4%{opacity:1;transform:none}}
@keyframes kCardA{0%{opacity:0;transform:translateX(34px)}61%{opacity:0;transform:translateX(34px);animation-timing-function:var(--eo)}61.01%{animation-timing-function:linear}64.2%{opacity:1;transform:none}}
@keyframes kCardB{0%{opacity:0;transform:translateX(34px)}63%{opacity:0;transform:translateX(34px);animation-timing-function:var(--eo)}63.01%{animation-timing-function:linear}66.2%{opacity:1;transform:none}}
/* beat 4 */
@keyframes kEnC{0%{opacity:0;stroke-dashoffset:1}73.8%{opacity:0;stroke-dashoffset:1;animation-timing-function:linear}74%{opacity:1;animation-timing-function:linear}78.4%{opacity:1;stroke-dashoffset:0}}
@keyframes kEnS{0%{opacity:0;stroke-dashoffset:1}75.4%{opacity:0;stroke-dashoffset:1;animation-timing-function:linear}75.6%{opacity:1}79.6%{opacity:1;stroke-dashoffset:0}}
@keyframes kEd{0%{opacity:0;transform:scale(.3)}77.4%{opacity:0;transform:scale(.3);animation-timing-function:var(--eo)}77.41%{animation-timing-function:linear}78.3%{opacity:1;transform:scale(1)}}
@keyframes kSlot{0%{opacity:0;stroke-dashoffset:1}79.4%{opacity:0;stroke-dashoffset:1;animation-timing-function:linear}79.6%{opacity:1}82%{opacity:1;stroke-dashoffset:0}}
@keyframes kBlk{0%{offset-distance:0;opacity:0}80.6%{offset-distance:0;opacity:0;animation-timing-function:cubic-bezier(.3,.7,.3,1)}81.2%{opacity:1}84.3%{offset-distance:100%}85%{offset-distance:94%}85.6%{offset-distance:102%}86.2%{offset-distance:100%}}
@keyframes kStX{0%{opacity:0;transform:scale(.4);animation-timing-function:var(--eo)}3.4%{opacity:1;transform:scale(1.12)}4.2%{transform:scale(1)}}
@keyframes kSheen{0%{opacity:0;transform:translateX(-140px)}88.4%{opacity:0;transform:translateX(-140px);animation-timing-function:cubic-bezier(.4,0,.3,1)}88.41%{animation-timing-function:linear}90%{opacity:.7}93.5%{opacity:0;transform:translateX(230px)}93.6%{opacity:0}}
@keyframes kW1{0%{opacity:0;transform:translateY(108%)}87.6%{opacity:0;transform:translateY(108%);animation-timing-function:var(--eo)}87.61%{animation-timing-function:linear}91.6%{opacity:1;transform:none}}
@keyframes kW2{0%{opacity:0;transform:translateY(108%)}88.5%{opacity:0;transform:translateY(108%);animation-timing-function:var(--eo)}88.51%{animation-timing-function:linear}92.5%{opacity:1;transform:none}}

<script>
(function(){
  var D=10800, stage=document.getElementById('stage');
  var num=document.getElementById('num'), cnt=document.getElementById('c1284'), q=document.getElementById('q');
  var rm=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(rm) stage.classList.add('rm');

  function fit(){
    var s=Math.min(window.innerWidth/1440, window.innerHeight/900);
    stage.style.setProperty('--s', s);
  }
  fit();
  window.addEventListener('resize', fit);

  function cssT(){
    try{
      var list=pg.getAnimations?pg.getAnimations():[];
      if(list.length&&list[0].currentTime!=null) return list[0].currentTime%D;
    }catch(e){}
    return 0;
  }
  var pg=document.getElementById('pg');
  var t0=performance.now();
  var lastN=-1,lastC=-1,lastQ=-1;
  function easeOut(p){p=Math.max(0,Math.min(1,p));return 1-Math.pow(1-p,3);}
  function fmt(n){return String(n).replace(/\B(?=(\d{3})+(?!\d))/g,',');}

  if(rm){
    num.textContent='47'; cnt.textContent='1,284'; q.textContent='golang';
    return;
  }
  function loop(){
    var t=cssT();
    /* beat 1 : count up to 47 */
    var p=(t-780)/820;
    var v=p<=0?-1:Math.round(47*easeOut(p));
    if(v!==lastN){lastN=v; num.textContent=v<0?'':(v===0?'0':String(v));}
    /* beat 3 : count to 1,284 */
    p=(t-6180)/1080;
    v=p<=0?-1:Math.round(1284*easeOut(p));
    if(v!==lastC){lastC=v; cnt.textContent=v<0?'0':fmt(v);}
    /* beat 3 : typing "golang" */
    var idx=Math.max(0,Math.min(6,Math.floor((t-5660)/85)));
    if(idx!==lastQ){lastQ=idx; q.textContent='golang'.slice(0,idx);}
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  function replay(){
    var a=document.getAnimations?document.getAnimations():[];
    for(var i=0;i<a.length;i++){try{a[i].currentTime=0;}catch(e){}}
    stage.classList.remove('paused');
  }
  function toggle(){
    stage.classList.toggle('paused');
  }
  document.getElementById('btnPlay').addEventListener('click',function(){toggle();this.blur();});
  document.getElementById('btnRz').addEventListener('click',function(){replay();this.blur();});
  window.addEventListener('keydown',function(e){
    if(e.code==='Space'){e.preventDefault(); if(!e.repeat) toggle();}
    else if(e.key==='r'||e.key==='R'){replay();}
  });
})();
</script>
