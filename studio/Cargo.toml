[package]
name = "zen-design-studio"
version = "0.2.0"
edition = "2021"
description = "ZenDesign studio rendered entirely in Rust/WASM with Leptos"
license = "MIT"

[dependencies]
console_error_panic_hook = "0.1"
gloo-net = "0.7"
gloo-timers = "0.4"
icondata_core = "0.1"
icondata_lu = "0.1"
js-sys = "0.3"
leptos = { version = "0.8", features = ["csr"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
send_wrapper = "0.6"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
  "Document",
  "DomParser",
  "Element",
  "Event",
  "EventSource",
  "EventTarget",
  "HtmlDivElement",
  "HtmlElement",
  "HtmlIFrameElement",
  "KeyboardEvent",
  "Location",
  "MessageEvent",
  "MouseEvent",
  "Node",
  "NodeList",
  "Storage",
  "SubmitEvent",
  "SupportedType",
  "Window",
] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
