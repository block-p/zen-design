<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head><meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data: blob:; font-src data:; media-src data: blob:; connect-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>قدرت — Power</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@100;300;400;700;900&display=swap');

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg: #050508;
  --gold: #C8A96E;
  --white: #E8E8F0;
  --red: #8B1A2E;
  --blue: #1A3A6E;
  --accent: #635bff;
  --beat: 0;
}

html, body {
  width: 100%; height: 100%;
  background: #000;
  overflow: hidden;
  font-family: 'Vazirmatn', 'Inter', system-ui, sans-serif;
}

#viewport {
  position: fixed;
  top: 50%; left: 50%;
  width: 720px; height: 1280px;
  transform-origin: center center;
  transform: translate(-50%, -50%) scale(1);
  background: var(--bg);
  overflow: hidden;
}

#bg-canvas {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  z-index: 1;
}

#scene {
  position: absolute; inset: 0;
  z-index: 2;
  display: flex; align-items: center; justify-content: center;
}

#svg-layer {
  position: absolute; inset: 0;
  z-index: 3;
  pointer-events: none;
}

#typo-layer {
  position: absolute; inset: 0;
  z-index: 4;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  pointer-events: none;
}

.beat-el {
  position: absolute; inset: 0;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  opacity: 0;
  transition: opacity 0.3s;
  pointer-events: none;
}

.typo-mask {
  overflow: hidden;
  display: inline-block;
  padding: 0.18em 0.12em;
  margin: -0.18em -0.12em;
  vertical-align: bottom;
}

.typo-inner {
  display: inline-block;
  transform: translateY(120%);
  transition: transform 0.7s cubic-bezier(0.16,1,0.3,1);
  color: var(--white);
  font-weight: 900;
  line-height: 1.15;
  letter-spacing: 0;
  text-align: center;
}

.typo-inner.revealed { transform: translateY(0); }

.word-gold { color: var(--gold); }
.word-red { color: var(--red); }
.word-blue { color: #4A7ADE; }

/* Progress bar */
#progress-bar {
  position: absolute; bottom: 0; left: 0;
  height: 2px; width: 0%;
  background: var(--gold);
  z-index: 10;
  box-shadow: 0 0 8px var(--gold), 0 0 20px var(--gold);
  transition: width 0.05s linear;
}
#progress-bar::after {
  content: '';
  position: absolute; right: 0; top: 50%;
  transform: translateY(-50%);
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--gold);
  box-shadow: 0 0 10px var(--gold);
}

#timer {
  position: absolute; bottom: 14px; left: 50%;
  transform: translateX(-50%);
  font-family: 'Courier New', monospace;
  font-size: 11px;
  color: rgba(200,169,110,0.5);
  z-index: 10;
  letter-spacing: 0.1em;
}

#ctrl-btns {
  position: absolute; bottom: 30px; right: 20px;
  z-index: 10;
  display: flex; flex-direction: column; gap: 8px;
  align-items: flex-end;
}

.ctrl-btn {
  background: none; border: none; cursor: pointer;
  color: rgba(200,169,110,0.6);
  font-family: 'Vazirmatn', sans-serif;
  font-size: 13px;
  padding: 4px 8px;
  transition: color 0.2s;
}
.ctrl-btn:hover { color: var(--gold); }

#start-hud {
  position: absolute; inset: 0;
  z-index: 20;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  background: rgba(5,5,8,0.85);
  backdrop-filter: blur(4px);
}

#start-hud .hud-title {
  font-size: 72px; font-weight: 900;
  color: var(--gold);
  letter-spacing: 0;
  margin-bottom: 16px;
  text-shadow: 0 0 40px rgba(200,169,110,0.6);
}
#start-hud .hud-sub {
  font-size: 18px; color: rgba(232,232,240,0.6);
  margin-bottom: 48px;
}
#start-btn {
  background: none;
  border: 1px solid rgba(200,169,110,0.5);
  color: var(--gold);
  font-family: 'Vazirmatn', sans-serif;
  font-size: 18px; font-weight: 700;
  padding: 16px 48px;
  cursor: pointer;
  letter-spacing: 0;
  transition: all 0.3s;
  position: relative;
}
#start-btn::before {
  content: '';
  position: absolute; inset: -1px;
  background: linear-gradient(135deg, var(--gold), transparent, var(--gold));
  opacity: 0;
  transition: opacity 0.3s;
  z-index: -1;
}
#start-btn:hover { 
  background: rgba(200,169,110,0.1);
  box-shadow: 0 0 30px rgba(200,169,110,0.3);
}

/* Subtitle overlay */
#subtitle {
  position: absolute;
  bottom: 60px; left: 40px; right: 40px;
  z-index: 9;
  text-align: center;
  font-size: 16px;
  font-weight: 400;
  color: rgba(232,232,240,0.75);
  line-height: 1.6;
  letter-spacing: 0;
  opacity: 0;
  transition: opacity 0.4s;
  pointer-events: none;
}

@media (prefers-reduced-motion: reduce) {
  .typo-inner { transition: none; }
  #start-hud { display: none; }
}
</style>
</head>
<body>
<div id="viewport">
  <canvas id="bg-canvas"></canvas>
  <div id="svg-layer">
    <svg id="main-svg" width="720" height="1280" viewBox="0 0 720 1280" style="position:absolute;inset:0;overflow:visible;"></svg>
  </div>
  <div id="typo-layer"></div>
  <div id="progress-bar"></div>
  <div id="timer">00:00 / 60s</div>
  <div id="ctrl-btns">
    <button class="ctrl-btn" id="btn-replay">↺</button>
    <button class="ctrl-btn" id="btn-sound">♪</button>
  </div>
  <div id="subtitle"></div>

  <div id="start-hud">
    <div class="hud-title">قدرت</div>
    <div class="hud-sub">علوم سیاسی — ۶۰ ثانیه</div>
    <button id="start-btn">▶ پخش فیلم + صدا</button>
  </div>
</div>

<script>
// ─── RESIZE ───────────────────────────────────────────────────
const VP = document.getElementById('viewport');
function resize(){
  const s = Math.min(window.innerWidth/720, window.innerHeight/1280);
  VP.style.transform = `translate(-50%,-50%) scale(${s})`;
}
resize(); window.addEventListener('resize', resize);

// ─── GLOBALS ──────────────────────────────────────────────────
const TOTAL = 60;
let startTime = null, elapsed = 0, paused = false, pauseAt = 0;
let audioCtx = null, masterGain = null, soundOn = false;
let animId = null;
const beatActive = new Set();

// ─── CANVAS SETUP ─────────────────────────────────────────────
const bgC = document.getElementById('bg-canvas');
const bgCtx = bgC.getContext('2d');
bgC.width = 720; bgC.height = 1280;

// Particles
const PCOUNT = 120;
const particles = [];
for(let i=0;i<PCOUNT;i++){
  particles.push({
    x: Math.random()*720,
    y: Math.random()*1280,
    r: Math.random()*1.5+0.5,
    vx: (Math.random()-0.5)*0.3,
    vy: -Math.random()*0.4-0.1,
    a: Math.random()*0.5+0.1,
    gold: Math.random()>0.6
  });
}

// Foreground particles (beat-triggered)
let fgParticles = [];
function spawnBurst(x,y,count,color){
  for(let i=0;i<count;i++){
    const a = Math.random()*Math.PI*2;
    const v = Math.random()*4+1;
    fgParticles.push({
      x,y, vx:Math.cos(a)*v, vy:Math.sin(a)*v,
      r: Math.random()*3+1, life:1, decay: Math.random()*0.02+0.015,
      color
    });
  }
}

// ─── WEB AUDIO ────────────────────────────────────────────────
function initAudio(){
  if(audioCtx) return;
  audioCtx = new (window.AudioContext||window.webkitAudioContext)();
  masterGain = audioCtx.createGain();
  masterGain.gain.value = 0.7;
  masterGain.connect(audioCtx.destination);

  // Ambient drone pad
  const drones = [73.4,110,174.6,261.6];
  drones.forEach((freq,i)=>{
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    const lp = audioCtx.createBiquadFilter();
    osc.type = i<2 ? 'sawtooth' : 'sine';
    osc.frequency.value = freq;
    // LFO
    const lfo = audioCtx.createOscillator();
    const lfoG = audioCtx.createGain();
    lfo.frequency.value = 0.1+i*0.07;
    lfoG.gain.value = 2;
    lfo.connect(lfoG); lfoG.connect(osc.frequency);
    lfo.start();
    lp.type='lowpass'; lp.frequency.value = 320;
    g.gain.value = 0.055;
    osc.connect(lp); lp.connect(g); g.connect(masterGain);
    osc.start();
  });
}

function playImpact(){
  if(!audioCtx) return;
  const t = audioCtx.currentTime;
  // Sub-bass
  const osc = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  const lp = audioCtx.createBiquadFilter();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(90,t);
  osc.frequency.exponentialRampToValueAtTime(32,t+0.8);
  lp.type='lowpass'; lp.frequency.value=140;
  g.gain.setValueAtTime(0.001,t);
  g.gain.linearRampToValueAtTime(0.4,t+0.015);
  g.gain.exponentialRampToValueAtTime(0.001,t+0.9);
  osc.connect(lp); lp.connect(g); g.connect(masterGain);
  osc.start(t); osc.stop(t+1);
}

function playChime(freq=659){
  if(!audioCtx) return;
  const t = audioCtx.currentTime;
  [freq, freq*1.5].forEach((f,i)=>{
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    const bp = audioCtx.createBiquadFilter();
    osc.type='sine'; osc.frequency.value=f;
    bp.type='bandpass'; bp.frequency.value=f; bp.Q.value=4;
    g.gain.setValueAtTime(0.001,t);
    g.gain.linearRampToValueAtTime(0.18-i*0.06,t+0.005);
    g.gain.exponentialRampToValueAtTime(0.001,t+0.35);
    osc.connect(bp); bp.connect(g); g.connect(masterGain);
    osc.start(t+i*0.03); osc.stop(t+0.5);
  });
}

function playWhoosh(){
  if(!audioCtx) return;
  const t = audioCtx.currentTime;
  // Noise via many detuned oscs
  for(let i=0;i<6;i++){
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    const lp = audioCtx.createBiquadFilter();
    osc.type='sawtooth';
    osc.frequency.setValueAtTime(180+i*40,t);
    osc.frequency.linearRampToValueAtTime(900+i*60,t+0.3);
    osc.frequency.linearRampToValueAtTime(100,t+0.7);
    lp.type='lowpass';
    lp.frequency.setValueAtTime(200,t);
    lp.frequency.linearRampToValueAtTime(1400,t+0.3);
    lp.frequency.linearRampToValueAtTime(120,t+0.7);
    g.gain.setValueAtTime(0.001,t);
    g.gain.linearRampToValueAtTime(0.04,t+0.15);
    g.gain.exponentialRampToValueAtTime(0.001,t+0.75);
    osc.connect(lp); lp.connect(g); g.connect(masterGain);
    osc.start(t); osc.stop(t+0.8);
  }
}

// ─── WEB SPEECH TTS ───────────────────────────────────────────
let ttsUtterance = null;
function startTTS(){
  if(!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  ttsUtterance = new SpeechSynthesisUtterance("در سال ۲۰۲۶، علوم سیاسی دیگر تنها به تحلیل متون کهن یا ساختار سنتی دولت‌ها محدود نمی‌شود. جهان امروز، صحنه پیوند عمیق قدرت، داده و فناوری است. جایی که هوش مصنوعی مولد، دیپلماسی الگوریتمی و جریان‌های پیچیده اطلاعات، سرنوشت ژئوپلیتیک را رقم می‌زنند. یک پژوهشگر سیاسی در سال ۲۰۲۶، همان‌قدر که نیازمند درک نظریه‌های موازنه قدرت است، باید سازوکار جنگ شناختی، حکمرانی سایبری و تأثیر هوش مصنوعی بر اراده رأی‌دهندگان را بشناسد. در این دوران پرشتاب، دموکراسی بیش از هر زمان دیگری با چالش شفافیت الگوریتم‌ها و حفظ هویت انسانی روبه‌روست. علوم سیاسی در سال ۲۰۲۶، قطب‌نمایی است برای عبور از آشفتگی داده‌ها؛ دانشی که به ما یادآوری می‌کند در میان نبردهای نامرئی سایبری، هدف نهایی قدرت همچنان باید عدالت، صلح و انسان باشد.");
  ttsUtterance.lang = "fa-IR";
  ttsUtterance.rate = 0.9;
  ttsUtterance.pitch = 1.0;
  window.speechSynthesis.speak(ttsUtterance);
}

// ─── SVG LAYER ────────────────────────────────────────────────
const svg = document.getElementById('main-svg');
let svgContent = '';

function setSVG(html){ svg.innerHTML = html; }
function clearSVG(){ svg.innerHTML = ''; }

// ─── TYPO LAYER ───────────────────────────────────────────────
const typoLayer = document.getElementById('typo-layer');

function showTypo(lines, sizes, colors, delays, yOffset=0){
  typoLayer.innerHTML = '';
  const wrap = document.createElement('div');
  wrap.style.cssText = `display:flex;flex-direction:column;align-items:center;gap:8px;transform:translateY(${yOffset}px);`;
  lines.forEach((text,i)=>{
    const mask = document.createElement('div');
    mask.className = 'typo-mask';
    const inner = document.createElement('div');
    inner.className = 'typo-inner';
    inner.textContent = text;
    inner.style.fontSize = sizes[i]||'96px';
    inner.style.color = colors[i]||'var(--white)';
    inner.style.letterSpacing = '0';
    inner.style.lineHeight = '1.15';
    mask.appendChild(inner);
    wrap.appendChild(mask);
    setTimeout(()=>inner.classList.add('revealed'), (delays[i]||0)*1000);
  });
  typoLayer.appendChild(wrap);
}

function clearTypo(){ typoLayer.innerHTML = ''; }

// subtitle helper
const subEl = document.getElementById('subtitle');
let subTimer = null;
function showSub(text, dur=3500){
  clearTimeout(subTimer);
  subEl.textContent = text;
  subEl.style.opacity = '1';
  subTimer = setTimeout(()=>{ subEl.style.opacity='0'; }, dur);
}

// ─── BEAT DEFINITIONS ─────────────────────────────────────────
// Each beat: {start, end, enter, exit}
const BEATS = [
  { id:1, start:0,   end:4   },
  { id:2, start:4,   end:8   },
  { id:3, start:8,   end:12  },
  { id:4, start:12,  end:16  },
  { id:5, start:16,  end:20  },
  { id:6, start:20,  end:24  },
  { id:7, start:24,  end:28  },
  { id:8, start:28,  end:32  },
  { id:9, start:32,  end:36  },
  { id:10, start:36, end:40  },
  { id:11, start:40, end:44  },
  { id:12, start:44, end:48  },
  { id:13, start:48, end:52  },
  { id:14, start:52, end:56  },
  { id:15, start:56, end:60  },
];

// ─── BEAT ENTER FUNCTIONS ─────────────────────────────────────

function beat1_enter(){
  playImpact();
  // Big Bang: concentric rings exploding SVG
  setSVG(`
    <defs>
      <radialGradient id="rg1" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#C8A96E" stop-opacity="0.8"/>
        <stop offset="100%" stop-color="#C8A96E" stop-opacity="0"/>
      </radialGradient>
      <filter id="glow1"><feGaussianBlur stdDeviation="3" result="blur"/>
        <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    </defs>
    <g transform="translate(360,560)" filter="url(#glow1)">
      ${[0,1,2,3,4,5].map(i=>`
        <circle r="${30+i*60}" fill="none" stroke="#C8A96E"
          stroke-width="${2.5-i*0.3}"
          stroke-dasharray="${(30+i*60)*2*Math.PI} ${(30+i*60)*2*Math.PI}"
          stroke-dashoffset="${(30+i*60)*2*Math.PI}"
          opacity="${0.8-i*0.12}">
          <animate attributeName="stroke-dashoffset" from="${(30+i*60)*2*Math.PI}" to="0"
            dur="${0.6+i*0.15}s" begin="${i*0.1}s" fill="freeze" calcMode="spline"
            keySplines="0.16 1 0.3 1"/>
          <animate attributeName="opacity" from="${0.8-i*0.12}" to="${0.1+i*0.02}"
            dur="2s" begin="${0.6+i*0.15}s" fill="freeze"/>
        </circle>`).join('')}
      <circle r="4" fill="#E8E8F0">
        <animate attributeName="r" values="4;20;4" dur="1s" repeatCount="1"/>
        <animate attributeName="opacity" values="1;0.3;1" dur="1s" repeatCount="1"/>
      </circle>
    </g>
    <radialGradient id="amb1" cx="50%" cy="44%" r="40%">
      <stop offset="0%" stop-color="#C8A96E" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#C8A96E" stop-opacity="0"/>
    </radialGradient>
    <rect width="720" height="1280" fill="url(#amb1)"/>
  `);
  showTypo(['قدرت'], ['160px'], ['#C8A96E'], [0.4], -80);
  showSub('در آغاز، قدرت بود');
  spawnBurst(360,560,60,'#C8A96E');
}

function beat2_enter(){
  playWhoosh();
  // Triangle of power: 3 forces
  const pts = [[360,380],[180,700],[540,700]];
  const labels = ['مردم','نخبه','نهاد'];
  setSVG(`
    <defs><filter id="glow2"><feGaussianBlur stdDeviation="4"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
    <g filter="url(#glow2)">
      ${pts.map((p,i)=>{
        const next = pts[(i+1)%3];
        const len = Math.hypot(next[0]-p[0],next[1]-p[1]);
        return `<line x1="${p[0]}" y1="${p[1]}" x2="${next[0]}" y2="${next[1]}"
          stroke="#C8A96E" stroke-width="2"
          stroke-dasharray="${len} ${len}" stroke-dashoffset="${len}">
          <animate attributeName="stroke-dashoffset" from="${len}" to="0"
            dur="0.8s" begin="${i*0.25}s" fill="freeze" calcMode="spline"
            keySplines="0.16 1 0.3 1"/>
        </line>
        <circle cx="${p[0]}" cy="${p[1]}" r="6" fill="#C8A96E" opacity="0">
          <animate attributeName="opacity" from="0" to="1" dur="0.3s"
            begin="${i*0.25+0.7}s" fill="freeze"/>
          <animate attributeName="r" values="6;14;6" dur="1.2s"
            begin="${i*0.25+0.7}s" repeatCount="indefinite"/>
        </circle>
        <text x="${p[0]+(i===0?0:i===1?-30:30)}" y="${p[1]+(i===0?-24:20)}"
          fill="#C8A96E" font-size="20" font-family="Vazirmatn,sans-serif"
          text-anchor="middle" opacity="0" font-weight="700">
          ${labels[i]}
          <animate attributeName="opacity" from="0" to="0.8" dur="0.4s"
            begin="${i*0.25+0.8}s" fill="freeze"/>
        </text>`;
      }).join('')}
    </g>
    <radialGradient id="ambT" cx="50%" cy="50%" r="35%">
      <stop offset="0%" stop-color="#1A3A6E" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#1A3A6E" stop-opacity="0"/>
    </radialGradient>
    <rect width="720" height="1280" fill="url(#ambT)"/>
  `);
  showTypo(['کی حکم','می‌راند؟'],['100px','100px'],['#E8E8F0','#C8A96E'],[0.2,0.45], -200);
  showSub('تثلیث قدرت: مردم، نخبه، نهاد');
  spawnBurst(360,540,40,'#1A3A6E');
}

function beat3_enter(){
  playChime(659);
  // Gears / State Machine
  setSVG(`
    <defs>
      <filter id="glow3"><feGaussianBlur stdDeviation="3"/>
        <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    </defs>
    <g transform="translate(360,580)" filter="url(#glow3)">
      <!-- Central gear -->
      <g><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="8s" repeatCount="indefinite"/>
        ${buildGear(0,0,80,16,'#1A3A6E','#4A7ADE',3)}</g>
      <!-- Satellite gear L -->
      <g transform="translate(-150,0)">
        <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="4s" additive="sum" repeatCount="indefinite"/>
        ${buildGear(0,0,45,12,'#C8A96E','#E8C88E',2)}</g>
      <!-- Satellite gear R -->
      <g transform="translate(150,0)">
        <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="4s" additive="sum" repeatCount="indefinite"/>
        ${buildGear(0,0,45,12,'#C8A96E','#E8C88E',2)}</g>
      <!-- Satellite gear top -->
      <g transform="translate(0,-130)">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="5.3s" additive="sum" repeatCount="indefinite"/>
        ${buildGear(0,0,35,10,'#8B1A2E','#BF3A5E',2)}</g>
      <!-- Connection lines -->
      <line x1="0" y1="0" x2="-150" y2="0" stroke="#C8A96E" stroke-width="1" stroke-dasharray="4,4" opacity="0.5">
        <animate attributeName="stroke-dashoffset" from="0" to="-40" dur="1s" repeatCount="indefinite"/>

function buildGear(cx,cy,r,teeth,fill,stroke,sw){
  let d = '';
  const ri = r*0.75;
  const step = (Math.PI*2)/teeth;
  for(let i=0;i<teeth;i++){
    const a = i*step - Math.PI/2;
    const a1 = a-step*0.3, a2=a-step*0.1, a3=a+step*0.1, a4=a+step*0.3;
    d += `M${cx+Math.cos(a1)*ri} ${cy+Math.sin(a1)*ri}
          L${cx+Math.cos(a2)*r} ${cy+Math.sin(a2)*r}
          L${cx+Math.cos(a3)*r} ${cy+Math.sin(a3)*r}
          L${cx+Math.cos(a4)*ri} ${cy+Math.sin(a4)*ri} `;
  }
  return `<circle cx="${cx}" cy="${cy}" r="${ri}" fill="${fill}" stroke="${stroke}" stroke-width="${sw}"/>
          <path d="${d}" fill="${fill}" stroke="${stroke}" stroke-width="${sw}" stroke-linejoin="round"/>
          <circle cx="${cx}" cy="${cy}" r="${r*0.2}" fill="${stroke}" opacity="0.8"/>`;
}

let wavePhase = 0;
function updateWaves(t){
  const wL = document.getElementById('waveL');
  const wR = document.getElementById('waveR');
  if(!wL||!wR) return;
  const progress = Math.min((t-12)/4,1);
  // Left wave travels right
  let dL='', dR='';
  for(let x=0;x<=360;x+=4){
    const fx = x*progress;
    const y = 640 + Math.sin((fx/60+wavePhase)*Math.PI*2)*80*Math.sin(Math.min(fx/180,1)*Math.PI);
    if(x===0) dL+=`M${fx} ${y}`; else dL+=`L${fx} ${y}`;
  }
  for(let x=720;x>=360;x-=4){
    const fx = (720-x)*progress;
    const y = 640 + Math.sin((-fx/60+wavePhase)*Math.PI*2)*80*Math.sin(Math.min(fx/180,1)*Math.PI);
    if(x===720) dR+=`M${720-fx} ${y}`; else dR+=`L${720-fx} ${y}`;
  }
  wL.setAttribute('d',dL);
  wR.setAttribute('d',dR);
}

// Simple boids
let boids = [];
let boidsActive = false;
let boidsPhase = 0; // 0=scatter 1=spiral
function initBoidsCanvas(){
  boidsActive = true;
  boidsPhase = 0;
  boids = [];
  for(let i=0;i<300;i++){
    boids.push({
      x:Math.random()*720, y:Math.random()*1280,
      vx:(Math.random()-0.5)*2, vy:(Math.random()-0.5)*2
    });
  }
}

function updateBoids(t){
  if(!boidsActive) return;
  const canvas = document.getElementById('boids-canvas');
  if(!canvas) { boidsActive=false; return; }
  const ctx2 = canvas.getContext('2d');
  ctx2.clearRect(0,0,720,1280);
  const phase = t - 16;
  boidsPhase = phase < 2 ? 0 : 1;
  boids.forEach(b=>{
    if(boidsPhase===1){
      // Attract to center spiral
      const dx=360-b.x, dy=640-b.y;
      const dist=Math.hypot(dx,dy)+1;
      b.vx += dx/dist*0.3;
      b.vy += dy/dist*0.3;
      // tangential swirl
      b.vx += -dy/dist*0.1;
      b.vy += dx/dist*0.1;
    } else {
      b.vx += (Math.random()-0.5)*0.2;
      b.vy += (Math.random()-0.5)*0.2;
    }
    const spd = Math.hypot(b.vx,b.vy);
    if(spd>3){ b.vx=b.vx/spd*3; b.vy=b.vy/spd*3; }
    b.x += b.vx; b.y += b.vy;
    b.x = ((b.x%720)+720)%720;
    b.y = ((b.y%1280)+1280)%1280;
    const dist2 = Math.hypot(b.x-360,b.y-640);
    const alpha = boidsPhase===1 ? Math.max(0,1-dist2/300)*0.8+0.2 : 0.5;
    ctx2.beginPath();
    ctx2.arc(b.x,b.y,1.5,0,Math.PI*2);
    ctx2.fillStyle = `rgba(200,169,110,${alpha})`;
    ctx2.fill();
  });
}

function buildNeuralNet(){
  const layers = [[180,3],[360,5],[540,4],[620,2]];
  const yBase = 380, gap = 120;
  let nodes = [];
  layers.forEach(([x,cnt])=>{
    for(let i=0;i<cnt;i++){
      const y = yBase + (i-(cnt-1)/2)*gap;
      nodes.push({x,y,layer:x});
    }
  });
  let out = '';
  // Connections
  const layerXs = [...new Set(layers.map(l=>l[0]))];
  for(let li=0;li<layerXs.length-1;li++){
    const from = nodes.filter(n=>n.layer===layerXs[li]);
    const to = nodes.filter(n=>n.layer===layerXs[li+1]);
    from.forEach(f=>{
      to.forEach(t=>{
        const len = Math.hypot(t.x-f.x,t.y-f.y);
        out += `<line x1="${f.x}" y1="${f.y}" x2="${t.x}" y2="${t.y}"
          stroke="#C8A96E" stroke-width="0.8" opacity="0.25"
          stroke-dasharray="${len} ${len}" stroke-dashoffset="${len}">
          <animate attributeName="stroke-dashoffset" from="${len}" to="0"
            dur="${0.6+Math.random()*0.4}s" begin="${Math.random()*0.5}s" fill="freeze"/>
          <animate attributeName="opacity" values="0.25;0.6;0.25" dur="${1+Math.random()}s"
            begin="${Math.random()}s" repeatCount="indefinite"/>
        </line>`;
      });
    });
  }
  // Nodes
  nodes.forEach((n,i)=>{
    out += `<circle cx="${n.x}" cy="${n.y}" r="10" fill="#1A3A6E"
      stroke="#C8A96E" stroke-width="1.5" opacity="0">
      <animate attributeName="opacity" from="0" to="0.9" dur="0.3s"
        begin="${i*0.05}s" fill="freeze"/>
      <animate attributeName="r" values="10;13;10" dur="${1.2+i%3*0.4}s"
        begin="${i*0.05}s" repeatCount="indefinite"/>
    </circle>`;
  });
  return out;
}

      out += `<text x="${x}" y="${y}" font-size="14"
        font-family="Courier New,monospace" fill="#4A7ADE"
        opacity="${Math.random()*0.25+0.03}"
        style="animation:flicker ${0.5+Math.random()*2}s ${delay}s infinite alternate">
        ${bit}</text>`;
    }
  }
  return out;
}

// ─── BEAT EXIT / TRANSITIONS ──────────────────────────────────
function transitionOut(nextBeatFn){
  // Glitch flash
  VP.style.filter = 'brightness(2) saturate(0)';
  setTimeout(()=>{ VP.style.filter=''; nextBeatFn(); }, 80);
}

// ─── MAIN RAF LOOP ────────────────────────────────────────────
let prevBeatId = 0;

function tick(now){
  if(paused){ animId=requestAnimationFrame(tick); return; }
  if(!startTime) startTime = now;
  elapsed = (now - startTime) / 1000;

  if(elapsed >= TOTAL){
    // Hold final, restart after 2.5s
    elapsed = TOTAL;
    updateUI();
    setTimeout(replay, 2500);
    return;
  }

  // Determine current beat
  const curBeat = BEATS.find(b=> elapsed>=b.start && elapsed<b.end);
  if(curBeat && curBeat.id !== prevBeatId){
    prevBeatId = curBeat.id;
    beatEnter(curBeat.id);
  }

  // Per-frame updates
  updateBgCanvas(elapsed);
  updateFgParticles();

  // Beat-specific per-frame
  if(curBeat){
    if(curBeat.id===4) updateWaves(elapsed);
    if(curBeat.id===5) updateBoids(elapsed);
    if(curBeat.id===8) updateDataWaves(elapsed);
  }

  updateUI();
  animId=requestAnimationFrame(tick);
}

function beatEnter(id){
  clearSVG();
  clearTypo();
  const fn = [null,beat1_enter,beat2_enter,beat3_enter,beat4_enter,
    beat5_enter,beat6_enter,beat7_enter,beat8_enter,beat9_enter,
    beat10_enter,beat11_enter,beat12_enter,beat13_enter,beat14_enter,beat15_enter][id];
  if(fn) fn();
  // Screen flash transition
  VP.style.transition='filter 0.08s';
  VP.style.filter='brightness(1.5)';
  setTimeout(()=>{ VP.style.filter=''; },80);
}

// ─── BACKGROUND CANVAS ────────────────────────────────────────
function updateBgCanvas(t){
  bgCtx.clearRect(0,0,720,1280);
  // Deep space gradient
  const grd = bgCtx.createRadialGradient(360,480,0,360,480,500);
  grd.addColorStop(0,`rgba(26,58,110,${0.12+Math.sin(t*0.3)*0.04})`);
  grd.addColorStop(0.5,`rgba(139,26,46,${0.04+Math.sin(t*0.2+1)*0.02})`);
  grd.addColorStop(1,'rgba(5,5,8,0)');
  bgCtx.fillStyle=grd; bgCtx.fillRect(0,0,720,1280);

  // Ambient particles
  particles.forEach(p=>{
    p.x += p.vx; p.y += p.vy;
    if(p.y<-5) p.y=1285;
    if(p.x<0) p.x=720; if(p.x>720) p.x=0;
    bgCtx.beginPath();
    bgCtx.arc(p.x,p.y,p.r,0,Math.PI*2);
    const col = p.gold ? `rgba(200,169,110,${p.a*0.6})` : `rgba(232,232,240,${p.a*0.3})`;
    bgCtx.fillStyle=col;
    bgCtx.fill();
  });

  // Travelling light ray
  const rayX = ((t*60)%820)-50;
  const rayGrd = bgCtx.createLinearGradient(rayX-80,0,rayX+80,0);
  rayGrd.addColorStop(0,'rgba(200,169,110,0)');
  rayGrd.addColorStop(0.5,`rgba(200,169,110,${0.03+Math.sin(t)*0.01})`);
  rayGrd.addColorStop(1,'rgba(200,169,110,0)');
  bgCtx.fillStyle=rayGrd;
  bgCtx.fillRect(rayX-80,0,160,1280);

  // fg particles
  fgParticles.forEach((p,i)=>{
    if(p.orbital){
      p.angle += p.angV * 0.016;
      p.x = p.cx + Math.cos(p.angle)*p.dist;
      p.y = p.cy + Math.sin(p.angle)*p.dist;
    } else {
      p.x += p.vx; p.y += p.vy;
    }
    p.life -= p.decay;
    bgCtx.beginPath();
    bgCtx.arc(p.x,p.y,p.r,0,Math.PI*2);
    bgCtx.fillStyle = p.color.startsWith('#')
      ? hexAlpha(p.color, p.life*0.8)
      : p.color;
    bgCtx.fill();
  });
  fgParticles = fgParticles.filter(p=>p.life>0);
}

function hexAlpha(hex,a){
  const r=parseInt(hex.slice(1,3),16);
  const g=parseInt(hex.slice(3,5),16);
  const b=parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${Math.max(0,Math.min(1,a))})`;
}

function updateFgParticles(){
  // handled in bg canvas
}

// ─── UI ───────────────────────────────────────────────────────
const progressBar = document.getElementById('progress-bar');
const timerEl = document.getElementById('timer');

function updateUI(){
  const pct = Math.min(elapsed/TOTAL*100,100);
  progressBar.style.width = pct+'%';
  timerEl.textContent = fmt(elapsed)+' / 60s';
}

function fmt(s){
  const m=Math.floor(s/60);
  const sec=Math.floor(s%60);
  return String(m).padStart(2,'0')+':'+String(sec).padStart(2,'0');
}

// ─── START / REPLAY / CONTROLS ────────────────────────────────
function start(){
  document.getElementById('start-hud').style.display='none';
  initAudio();
  if(audioCtx && audioCtx.state==='suspended') audioCtx.resume();
  soundOn = true;
  if(masterGain) masterGain.gain.value=0.7;
  startTTS();
  startTime = null;
  elapsed = 0;
  prevBeatId = 0;
  fgParticles = [];
  boidsActive = false;
  if(animId) cancelAnimationFrame(animId);
  animId = requestAnimationFrame(tick);
}

function replay(){
  startTime = null;
  elapsed = 0;
  prevBeatId = 0;
  fgParticles = [];
  boidsActive = false;
  clearSVG();
  clearTypo();
  if(window.speechSynthesis) window.speechSynthesis.cancel();
  startTTS();
  if(animId) cancelAnimationFrame(animId);
  animId = requestAnimationFrame(tick);
}

document.getElementById('start-btn').addEventListener('click', start);
document.getElementById('btn-replay').addEventListener('click', ()=>{
  if(!startTime) { start(); return; }
  replay();
});

document.getElementById('btn-sound').addEventListener('click', ()=>{
  if(!audioCtx){ initAudio(); soundOn=true; }
  soundOn = !soundOn;
  if(masterGain) masterGain.gain.value = soundOn ? 0.7 : 0;
  document.getElementById('btn-sound').textContent = soundOn ? '♪' : '♪̶';
  if(audioCtx && audioCtx.state==='suspended') audioCtx.resume();
});

// Keyboard
document.addEventListener('keydown', e=>{
  if(e.code==='Space'){ e.preventDefault();
    if(!startTime){ start(); return; }
    paused=!paused;
    if(paused) pauseAt=elapsed;
    else startTime = performance.now() - elapsed*1000;
    if(window.speechSynthesis){
      paused ? window.speechSynthesis.pause() : window.speechSynthesis.resume();
    }
  }
  if(e.code==='KeyR') replay();
});

// prefers-reduced-motion
if(window.matchMedia('(prefers-reduced-motion: reduce)').matches){
  document.getElementById('start-hud').style.display='none';
  beat15_enter();
}

// Inject flicker keyframe
const style = document.createElement('style');
style.textContent=`
@keyframes flicker {
  from { opacity: var(--from-op, 0.05); }
  to { opacity: var(--to-op, 0.3); }
}
@keyframes letterSpace {
  from { letter-spacing: 0.8em; }
  to { letter-spacing: 0.05em; }
}
`;
document.head.appendChild(style);
</script>
