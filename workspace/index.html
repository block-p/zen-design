<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  width: 100vw;
  height: 100vh;
  overflow: hidden;
  background: #0a2540;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: system-ui, sans-serif;
}

#stage {
  position: relative;
  width: 1440px;
  height: 900px;
  transform-origin: center center;
  overflow: hidden;
  background: radial-gradient(circle at 50% 30%, color-mix(in srgb, #635bff 12%, transparent), transparent 70%);
}

#canvas {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
}

#scene {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
}

.typo-mask {
  overflow: hidden;
  display: inline-block;
  padding: 0.2em 0.15em;
  margin: -0.2em -0.15em;

}

.typo-inner {
  display: inline-block;

#progress-bar {
  position: absolute;
  bottom: 0;
  left: 0;
  width: 100%;

  background: rgba(255, 255, 255, 0.1);
  pointer-events: none;
}

#progress-fill {
  position: absolute;
  left: 0;
  top: 0;
  height: 100%;
  width: 0%;

  transition: width 0.05s linear;
}

#timer {
  position: absolute;
  bottom: 12px;
  right: 20px;

}

#start-btn {
  position: absolute;

  left: 50%;

  position: absolute;
  bottom: 20px;
  left: 20px;
  width: 40px;
  height: 40px;
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.15);

#replay-btn:hover {
  background: rgba(255, 255, 255, 0.15);

}

@media (prefers-reduced-motion: reduce) {
  * {
    animation-duration: 0.01ms !important;
    transition-duration: 0.01ms !important;

}

@keyframes float-up {
  from { transform: translateY(0) scale(0.3); opacity: 0; }
  to { transform: translateY(-40px) scale(1); opacity: 1; }
}

@keyframes fall-down {
  from { transform: translateY(-200px); opacity: 0; }
  to { transform: translateY(0); opacity: 1; }
}

@keyframes ripple-expand {
  from { transform: scale(0); opacity: 1; }
  to { transform: scale(3); opacity: 0; }
}

@keyframes river-flow {
  from { stroke-dashoffset: 2000; }
  to { stroke-dashoffset: 0; }
}

<script id="zen-audio-engine">
window.ZenAudio = (() => {
  let ctx = null;
  let hasUserInteracted = false;

  function getContext() {
    if (!ctx) {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (AudioCtx) ctx = new AudioCtx();
    }
    if (ctx && ctx.state === 'suspended') {
      ctx.resume().catch(() => {});
    }
    return ctx;
  }

  function play(type) {
    try {
      const c = getContext();
      if (!c) return;
      const now = c.currentTime;

      if (type === 'whoosh') {
        const osc = c.createOscillator();
        const gain = c.createGain();
        const filter = c.createBiquadFilter();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(140, now);
        osc.frequency.exponentialRampToValueAtTime(520, now + 0.1);
        osc.frequency.exponentialRampToValueAtTime(70, now + 0.3);
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(500, now);
        filter.frequency.exponentialRampToValueAtTime(1800, now + 0.1);
        filter.frequency.exponentialRampToValueAtTime(150, now + 0.3);
        gain.gain.setValueAtTime(0.001, now);
        gain.gain.linearRampToValueAtTime(0.2, now + 0.06);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.34);
        osc.connect(filter);
        filter.connect(gain);
        gain.connect(c.destination);
        osc.start(now);
        osc.stop(now + 0.35);
      } else if (type === 'punch' || type === 'impact') {
        const osc = c.createOscillator();
        const gain = c.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(130, now);
        osc.frequency.exponentialRampToValueAtTime(34, now + 0.28);
        gain.gain.setValueAtTime(0.35, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.38);
        osc.connect(gain);
        gain.connect(c.destination);
        osc.start(now);
        osc.stop(now + 0.4);
      } else if (type === 'chime' || type === 'success') {
        [659.25, 987.77, 1318.51].forEach((freq, i) => {
          const osc = c.createOscillator();
          const gain = c.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, now + i * 0.06);
          gain.gain.setValueAtTime(0.001, now + i * 0.06);
          gain.gain.linearRampToValueAtTime(0.12, now + i * 0.06 + 0.015);
          gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.06 + 0.45);
          osc.connect(gain);
          gain.connect(c.destination);
          osc.start(now + i * 0.06);
          osc.stop(now + i * 0.06 + 0.48);
        });
      } else if (type === 'digital' || type === 'blip') {
        [880, 1174.66, 1760].forEach((freq, i) => {
          const osc = c.createOscillator();
          const gain = c.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, now + i * 0.035);
          gain.gain.setValueAtTime(0.08, now + i * 0.035);
          gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.035 + 0.08);
          osc.connect(gain);
          gain.connect(c.destination);
          osc.start(now + i * 0.035);
          osc.stop(now + i * 0.035 + 0.09);
        });
      } else if (type === 'sweep') {
        const osc = c.createOscillator();
        const gain = c.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(220, now);
        osc.frequency.exponentialRampToValueAtTime(880, now + 0.4);
        gain.gain.setValueAtTime(0.001, now);
        gain.gain.linearRampToValueAtTime(0.14, now + 0.15);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.45);
        osc.connect(gain);
        gain.connect(c.destination);
        osc.start(now);
        osc.stop(now + 0.46);
      } else if (type === 'riser') {
        const osc = c.createOscillator();
        const gain = c.createGain();
        osc.type = 'sawtooth';
        const filter = c.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(300, now);
        filter.frequency.exponentialRampToValueAtTime(2400, now + 0.5);
        osc.frequency.setValueAtTime(110, now);
        osc.frequency.exponentialRampToValueAtTime(440, now + 0.5);
        gain.gain.setValueAtTime(0.02, now);
        gain.gain.linearRampToValueAtTime(0.12, now + 0.4);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.55);
        osc.connect(filter);
        filter.connect(gain);
        gain.connect(c.destination);
        osc.start(now);
        osc.stop(now + 0.56);
      } else if (type === 'drop') {
        const osc = c.createOscillator();
        const gain = c.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(160, now);
        osc.frequency.exponentialRampToValueAtTime(36, now + 0.6);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.65);
        osc.connect(gain);
        gain.connect(c.destination);
        osc.start(now);
        osc.stop(now + 0.7);
      }
    } catch (e) {
      console.warn('ZenAudio error:', e);
    }
  }

  let currentAudio = null;
  async function speak(text, options = {}) {
    if (!text || !text.trim()) return;
    stopSpeech();
    try {
      const resp = await fetch('/api/tts', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          text: text.trim(),
          voice: options.voice || null,
          rate: options.rate || null
        })
      });
      if (resp.ok) {
        const blob = await resp.blob();
        const audioUrl = URL.createObjectURL(blob);
        const audio = new Audio(audioUrl);
        currentAudio = audio;
        audio.onended = () => {
          URL.revokeObjectURL(audioUrl);
          if (currentAudio === audio) currentAudio = null;
        };
        await audio.play();
        return;
      }
    } catch (err) {
      console.warn('ZenAudio neural TTS fetch failed, trying speechSynthesis fallback:', err);
    }

    if (window.speechSynthesis) {
      const u = new SpeechSynthesisUtterance(text.trim());
      const isFa = /[\u0600-\u06FF]/.test(text);
      u.lang = isFa ? 'fa-IR' : 'en-US';
      window.speechSynthesis.speak(u);
    }
  }

  function stopSpeech() {
    if (currentAudio) {
      currentAudio.pause();
      currentAudio = null;
    }
    if (window.speechSynthesis) {
      window.speechSynthesis.cancel();
    }
  }

  function init() {
    ['click', 'keydown', 'touchstart'].forEach(evt => {
      window.addEventListener(evt, () => {
        hasUserInteracted = true;
        getContext();
      }, { once: true, passive: true });
    });

    document.addEventListener('click', (e) => {
      hasUserInteracted = true;
      getContext();
      const target = e.target.closest('[data-sfx], [data-sfx-type]');
      if (target) {
        const sfx = target.getAttribute('data-sfx') || target.getAttribute('data-sfx-type');
        if (sfx && sfx !== 'none') play(sfx);
      }
    }, true);

    document.addEventListener('mouseenter', (e) => {
      const target = e.target.closest('[data-sfx-trigger="hover"]');
      if (target) {
        const sfx = target.getAttribute('data-sfx') || target.getAttribute('data-sfx-type');
        if (sfx && sfx !== 'none') play(sfx);
      }
    }, true);

    // Auto-detect slide activation and play slide transition sound effect
    const observer = new MutationObserver((mutations) => {
      if (!hasUserInteracted) return;
      for (const m of mutations) {
        if (m.type === 'attributes' && m.attributeName === 'class') {
          const target = m.target;
          if (target.classList && target.classList.contains('slide') && target.classList.contains('active')) {
            const sfx = target.getAttribute('data-sfx') || 'whoosh';
            if (sfx !== 'none') play(sfx);
          }
        }
      }
    });

    document.querySelectorAll('.slide, section[id^="s"]').forEach((s) => {
      observer.observe(s, { attributes: true, attributeFilter: ['class'] });
    });

    window.addEventListener('message', (e) => {
      if (!e.data) return;
      if (e.data.type === 'zd-speak' && e.data.text) {
        speak(e.data.text, e.data);
      } else if (e.data.type === 'zd-stop-speech') {
        stopSpeech();
      } else if (e.data.type === 'zd-play-sfx' && e.data.sfx) {
        play(e.data.sfx);
      }
    });
  }

  if (typeof document !== 'undefined') {
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }
  }

  return { play, speak, stopSpeech, getContext };
})();
</script>

<body>

<div id="stage">
  <canvas id="canvas"></canvas>
  <svg id="scene" viewBox="0 0 1440 900" xmlns="http://www.w3.org/2000/svg"></svg>
  <div id="kinetic-text"></div>
  
  <div id="progress-bar">
    <div id="progress-fill"></div>
  </div>
  <div id="timer">00:00 / 10s</div>
  
  <button id="start-btn">▶ شروع فیلم با صدا</button>
  <button id="replay-btn">↻</button>
</div>

<script>
const TOTAL = 10;
const stage = document.getElementById('stage');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const scene = document.getElementById('scene');
const kineticText = document.getElementById('kinetic-text');
const progressFill = document.getElementById('progress-fill');
const timer = document.getElementById('timer');
const startBtn = document.getElementById('start-btn');
const replayBtn = document.getElementById('replay-btn');

canvas.width = 1440;
canvas.height = 900;

let audioEnabled = false;
let startTime = null;
let animationId = null;
let currentBeat = -1;
let currentAudio = null;

const audioCache = {};
const beats = [
  { time: 0, narr: 'در دل ابر، قطره‌ای جان می‌گیرد', typo: 'تولد' },
  { time: 3.3, narr: 'می‌افتد، می‌شتابد، زمین را می‌جوید', typo: 'سقوط آزاد' },
  { time: 6.7, narr: 'با هزاران قطره دیگر یکی می‌شود و رودخانه‌ای می‌سازد', typo: 'رودخانه' }
];

class Particle {
  constructor(x, y, vx, vy, size, color) {
    this.x = x;
    this.y = y;
    this.vx = vx;
    this.vy = vy;
    this.size = size;
    this.color = color;
    this.life = 1;
  }
  update(dt) {
    this.x += this.vx * dt;
    this.y += this.vy * dt;
    this.life -= dt * 0.3;
  }
  draw(ctx) {
    if (this.life <= 0) return;
    ctx.globalAlpha = this.life;
    ctx.fillStyle = this.color;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
  }
}

let particles = [];

function scaleStage() {
  const vw = window.innerWidth;
  const vh = window.innerHeight;
  const scale = Math.min(vw / 1440, vh / 900);
  stage.style.transform = `translate(-50%, -50%) scale(${scale})`;
}
window.addEventListener('resize', scaleStage);
scaleStage();

async function preloadAllNarration() {
  for (let i = 0; i < beats.length; i++) {
    try {
      const res = await fetch('/api/tts', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          text: beats[i].narr,
          voice: 'fa-IR-DilaraNeural',
          rate: '1.0'
        })
      });
      if (res.ok) {
        const blob = await res.blob();
        audioCache[i] = new Audio(URL.createObjectURL(blob));
      }
    } catch (e) {}
  }
}

async function playNarrationForBeat(index, fallbackText) {
  if (!audioEnabled) return;
  if (currentAudio) {
    try { currentAudio.pause(); currentAudio.currentTime = 0; } catch (e) {}
  }
  if (audioCache[index]) {
    currentAudio = audioCache[index];
    currentAudio.currentTime = 0;
    await currentAudio.play().catch(() => {});
    return;
  }
  try {
    const res = await fetch('/api/tts', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text: fallbackText, voice: 'fa-IR-DilaraNeural' })
    });
    if (res.ok) {
      const blob = await res.blob();
      currentAudio = new Audio(URL.createObjectURL(blob));
      await currentAudio.play().catch(() => {});
      return;
    }
  } catch (e) {}
  if (window.speechSynthesis) {
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(fallbackText);
    u.lang = 'fa-IR';
    window.speechSynthesis.speak(u);
  }
}

function setKineticText(text) {
  kineticText.innerHTML = `<span class="typo-mask"><span class="typo-inner">${text}</span></span>`;
  const inner = kineticText.querySelector('.typo-inner');
  setTimeout(() => {
    inner.style.transition = 'transform 0.8s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1)';
    inner.style.transform = 'translateY(0%)';
    inner.style.opacity = '1';
  }, 50);
}

function clearScene() {
  scene.innerHTML = '';
}

function renderBeat0() {
  clearScene();
  particles = [];
  for (let i = 0; i < 120; i++) {
    particles.push(new Particle(
      Math.random() * 1440,
      Math.random() * 900,
      (Math.random() - 0.5) * 20,
      (Math.random() - 0.5) * 20,
      Math.random() * 3 + 1,
      'rgba(200, 220, 255, 0.6)'
    ));
  }
  
  const cloud = document.createElementNS('http://www.w3.org/2000/svg', 'g');
  cloud.innerHTML = `
    <ellipse cx="720" cy="300" rx="280" ry="140" fill="rgba(150, 170, 200, 0.4)" opacity="0">
      <animate attributeName="opacity" from="0" to="0.8" dur="1.2s" fill="freeze"/>
      <animate attributeName="ry" from="100" to="140" dur="1.5s" fill="freeze"/>
    </ellipse>
    <ellipse cx="600" cy="320" rx="200" ry="100" fill="rgba(160, 180, 210, 0.5)" opacity="0">
      <animate attributeName="opacity" from="0" to="0.7" dur="1.4s" fill="freeze"/>
    </ellipse>
    <ellipse cx="840" cy="320" rx="200" ry="100" fill="rgba(160, 180, 210, 0.5)" opacity="0">
      <animate attributeName="opacity" from="0" to="0.7" dur="1.4s" fill="freeze"/>
    </ellipse>
    <circle cx="720" cy="380" r="18" fill="#8fb9ff" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="1s" begin="0.8s" fill="freeze"/>
      <animate attributeName="r" from="8" to="18" dur="1s" begin="0.8s" fill="freeze"/>
    </circle>
  `;
  scene.appendChild(cloud);
  setKineticText('تولد');
}

function renderBeat1() {
  clearScene();
  particles = [];
  
  const drop = document.createElementNS('http://www.w3.org/2000/svg', 'g');
  drop.innerHTML = `
    <defs>
      <linearGradient id="dropGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" style="stop-color:#a0d5ff;stop-opacity:1" />
        <stop offset="100%" style="stop-color:#3b8ed6;stop-opacity:1" />
      </linearGradient>
      <filter id="blur">
        <feGaussianBlur in="SourceGraphic" stdDeviation="2" />
      </filter>
    </defs>
    <ellipse cx="720" cy="-100" rx="22" ry="36" fill="url(#dropGrad)" opacity="0.9">
      <animate attributeName="cy" from="-100" to="750" dur="2.5s" fill="freeze"/>
      <animate attributeName="ry" from="36" to="44" dur="2.5s" fill="freeze"/>
    </ellipse>
    <line x1="720" y1="-80" x2="720" y2="-200" stroke="#6db3ff" stroke-width="3" opacity="0.6" filter="url(#blur)">
      <animate attributeName="y1" from="-80" to="730" dur="2.5s" fill="freeze"/>
      <animate attributeName="y2" from="-200" to="610" dur="2.5s" fill="freeze"/>
    </line>
  `;
  scene.appendChild(drop);
  
  for (let i = 0; i < 40; i++) {
    setTimeout(() => {
      particles.push(new Particle(
        720 + (Math.random() - 0.5) * 60,
        Math.random() * 400 + 200,
        (Math.random() - 0.5) * 40,
        Math.random() * 100 + 50,
        Math.random() * 2 + 1,
        'rgba(180, 220, 255, 0.5)'
      ));
    }, i * 50);
  }
  
  setKineticText('سقوط آزاد');
}

function renderBeat2() {
  clearScene();
  particles = [];
  
  const river = document.createElementNS('http://www.w3.org/2000/svg', 'g');
  river.innerHTML = `
    <defs>
      <linearGradient id="riverGrad" x1="0%" y1="50%" x2="100%" y2="50%">
        <stop offset="0%" style="stop-color:#2a6fa0;stop-opacity:1" />
        <stop offset="50%" style="stop-color:#4fa8d6;stop-opacity:1" />
        <stop offset="100%" style="stop-color:#2a6fa0;stop-opacity:1" />
      </linearGradient>
      <filter id="glow">
        <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
        <feMerge>
          <feMergeNode in="coloredBlur"/>
          <feMergeNode in="SourceGraphic"/>
        </feMerge>
      </filter>
    </defs>
    <path d="M 0,500 Q 360,480 720,500 T 1440,500 L 1440,900 L 0,900 Z" fill="url(#riverGrad)" opacity="0">
      <animate attributeName="opacity" from="0" to="0.85" dur="1.2s" fill="freeze"/>
    </path>
    <circle cx="720" cy="500" r="0" fill="none" stroke="#6db3ff" stroke-width="3" opacity="0.8">
      <animate attributeName="r" from="0" to="200" dur="1.5s" fill="freeze"/>
      <animate attributeName="opacity" from="0.8" to="0" dur="1.5s" fill="freeze"/>
    </circle>
    <circle cx="720" cy="500" r="0" fill="none" stroke="#6db3ff" stroke-width="2" opacity="0.6">
      <animate attributeName="r" from="0" to="300" dur="2s" begin="0.3s" fill="freeze"/>
      <animate attributeName="opacity" from="0.6" to="0" dur="2s" begin="0.3s" fill="freeze"/>
    </circle>
    <path d="M 200,500 Q 400,490 600,500 T 1000,500" fill="none" stroke="#8fd4ff" stroke-width="4" opacity="0.7" filter="url(#glow)" stroke-dasharray="2000" stroke-dashoffset="2000">
      <animate attributeName="stroke-dashoffset" from="2000" to="0" dur="2.5s" fill="freeze"/>
    </path>
    <path d="M 300,550 Q 500,540 700,550 T 1100,550" fill="none" stroke="#6db3ff" stroke-width="3" opacity="0.5" stroke-dasharray="2000" stroke-dashoffset="2000">
      <animate attributeName="stroke-dashoffset" from="2000" to="0" dur="3s" begin="0.2s" fill="freeze"/>
    </path>
  `;
  scene.appendChild(river);
  
  for (let i = 0; i < 60; i++) {
    setTimeout(() => {
      particles.push(new Particle(
        Math.random() * 1440,
        Math.random() * 200 + 450,
        (Math.random() - 0.5) * 80,
        (Math.random() - 0.5) * 30,
        Math.random() * 3 + 1,
        'rgba(140, 210, 255, 0.7)'
      ));
    }, i * 40);
  }
  
  setKineticText('رودخانه');
}

function drawAmbient(elapsed) {
  ctx.fillStyle = 'rgba(10, 37, 64, 0.15)';
  ctx.fillRect(0, 0, 1440, 900);
  
  const dt = 0.016;
  for (let i = particles.length - 1; i >= 0; i--) {
    particles[i].update(dt);
    particles[i].draw(ctx);
    if (particles[i].life <= 0) particles.splice(i, 1);
  }
  
  if (currentBeat === 0) {
    ctx.globalAlpha = 0.3;
    ctx.fillStyle = `rgba(99, 91, 255, ${0.1 + Math.sin(elapsed * 2) * 0.05})`;
    ctx.beginPath();
    ctx.arc(720, 300, 200 + Math.sin(elapsed * 3) * 20, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
  }
}

function tick(now) {
  if (!startTime) return;
  
  const elapsed = (now - startTime) / 1000;
  
  drawAmbient(elapsed);
  
  progressFill.style.width = `${Math.min(elapsed / TOTAL * 100, 100)}%`;
  timer.textContent = `${Math.floor(elapsed).toString().padStart(2, '0')}:${Math.floor((elapsed % 1) * 100).toString().padStart(2, '0')} / ${TOTAL}s`;
  
  for (let i = beats.length - 1; i >= 0; i--) {
    if (elapsed >= beats[i].time && currentBeat < i) {
      currentBeat = i;
      if (i === 0) renderBeat0();
      else if (i === 1) renderBeat1();
      else if (i === 2) renderBeat2();
      playNarrationForBeat(i, beats[i].narr);
      break;
    }
  }
  
  if (elapsed >= TOTAL) {
    setTimeout(() => {
      restart();
    }, 2500);
    return;
  }
  
  animationId = requestAnimationFrame(tick);
}

function start() {
  audioEnabled = true;
  startBtn.style.display = 'none';
  replayBtn.style.display = 'flex';
  startTime = performance.now();
  currentBeat = -1;
  animationId = requestAnimationFrame(tick);
}

function restart() {
  if (currentAudio) {
    try { currentAudio.pause(); currentAudio.currentTime = 0; } catch (e) {}
  }
  if (animationId) cancelAnimationFrame(animationId);
  clearScene();
  particles = [];
  kineticText.innerHTML = '';
  progressFill.style.width = '0%';
  timer.textContent = '00:00 / 10s';
  currentBeat = -1;
  startTime = performance.now();
  animationId = requestAnimationFrame(tick);
}

startBtn.addEventListener('click', start);
replayBtn.addEventListener('click', restart);

document.addEventListener('keydown', (e) => {
  if (e.code === 'Space') {
    e.preventDefault();
    if (!startTime) start();
    else if (animationId) {
      cancelAnimationFrame(animationId);
      animationId = null;
    } else {
      startTime = performance.now() - ((performance.now() - startTime));
      animationId = requestAnimationFrame(tick);
    }
  } else if (e.code === 'KeyR') {
    restart();
  }
});

preloadAllNarration();
</script>

</body>
