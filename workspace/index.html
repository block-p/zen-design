<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head><meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data: blob:; font-src data:; media-src data: blob:; connect-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'">

<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>تولد پردازنده</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#000;overflow:hidden;font-family:'Vazirmatn','Inter',system-ui,sans-serif}

#stage{
  position:fixed;top:50%;left:50%;
  width:1440px;height:900px;
  transform-origin:center center;
  transform:translate(-50%,-50%) scale(1);
  overflow:hidden;
  background:#050508;
}

/* ── Ambient bg ── */
#bg-canvas{position:absolute;inset:0;z-index:0}
#svg-layer{position:absolute;inset:0;z-index:1;pointer-events:none}
#mid-canvas{position:absolute;inset:0;z-index:2;pointer-events:none}
#typo-layer{position:absolute;inset:0;z-index:3;pointer-events:none}
#fg-layer{position:absolute;inset:0;z-index:4;pointer-events:none}

/* ── Progress bar ── */
#progress-bar{
  position:absolute;bottom:0;left:0;height:2px;width:0%;
  background:linear-gradient(90deg,#7B2FFF,#00D4FF);
  z-index:10;
  box-shadow:0 0 8px #00D4FF80;
  transition:width 0.1s linear;
}
#progress-tip{
  position:absolute;right:0;top:-2px;width:6px;height:6px;
  background:#00D4FF;border-radius:50%;
  box-shadow:0 0 10px #00D4FF;
}

/* ── Counter ── */
#counter{
  position:absolute;bottom:12px;left:20px;
  font-family:'Courier New',monospace;font-size:11px;
  color:#ffffff30;z-index:10;letter-spacing:0.08em;
}

/* ── Controls ── */
#controls{
  position:absolute;top:20px;left:20px;
  z-index:10;display:flex;gap:12px;align-items:center;
}
.ctrl-btn{
  background:none;border:1px solid #ffffff20;
  color:#ffffff60;font-size:11px;padding:5px 10px;
  cursor:pointer;font-family:inherit;letter-spacing:0.05em;
  transition:all 0.2s;border-radius:2px;
}
.ctrl-btn:hover{border-color:#00D4FF60;color:#00D4FF}

/* ── Typography base ── */
.typo-line{
  position:absolute;overflow:hidden;
  pointer-events:none;
}
.typo-inner{
  display:block;
  transform:translateY(115%);
  transition:transform 0.7s cubic-bezier(0.16,1,0.3,1);
  white-space:nowrap;
}
.typo-inner.revealed{transform:translateY(0%)}
.typo-inner.exited{
  transform:translateY(-115%);
  transition:transform 0.35s cubic-bezier(0.7,0,0.84,0);
}

/* ── Kinetic typography styles ── */
.t-hero{
  font-size:clamp(72px,10vw,160px);
  font-weight:900;
  letter-spacing:-0.05em;
  line-height:0.92;
  color:#F0F4FF;
}
.t-large{
  font-size:clamp(48px,7vw,110px);
  font-weight:800;
  letter-spacing:-0.04em;
  line-height:0.94;
  color:#F0F4FF;
}
.t-mid{
  font-size:clamp(32px,4vw,72px);
  font-weight:700;
  letter-spacing:-0.03em;
  color:#F0F4FF;
}
.t-sub{
  font-size:clamp(16px,2vw,28px);
  font-weight:300;
  letter-spacing:0.12em;
  color:#ffffff60;
}

.c-cyan{color:#00D4FF}
.c-purple{color:#7B2FFF}
.c-orange{color:#FF6B35}
.c-gold{color:#C8A032}
.c-green{color:#00FF44}

/* ── Act overlay ── */
#act-overlay{
  position:absolute;inset:0;z-index:5;
  background:#050508;
  pointer-events:none;
}

/* ── Reduced motion ── */
@media(prefers-reduced-motion:reduce){
  .typo-inner{transition:none}
  #mid-canvas,#bg-canvas{display:none}
}
</style>
</head>
<body>

<div id="stage">
  <canvas id="bg-canvas" width="1440" height="900"></canvas>
  <svg id="svg-layer" viewBox="0 0 1440 900" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <filter id="glow-cyan" x="-50%" y="-50%" width="200%" height="200%">
        <feGaussianBlur stdDeviation="4" result="blur"/>
        <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
      <filter id="glow-orange" x="-50%" y="-50%" width="200%" height="200%">
        <feGaussianBlur stdDeviation="5" result="blur"/>
        <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
      <filter id="glow-purple" x="-50%" y="-50%" width="200%" height="200%">
        <feGaussianBlur stdDeviation="6" result="blur"/>
        <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
      <filter id="glow-white" x="-50%" y="-50%" width="200%" height="200%">
        <feGaussianBlur stdDeviation="3" result="blur"/>
        <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
      <radialGradient id="wafer-grad" cx="50%" cy="40%" r="55%">
        <stop offset="0%" stop-color="#C0C8D8"/>
        <stop offset="35%" stop-color="#7B2FFF" stop-opacity="0.3"/>
        <stop offset="70%" stop-color="#00D4FF" stop-opacity="0.2"/>
        <stop offset="100%" stop-color="#1A1A2E"/>
      </radialGradient>
      <radialGradient id="metal-grad" cx="30%" cy="30%" r="70%">
        <stop offset="0%" stop-color="#3A3A5E"/>
        <stop offset="50%" stop-color="#1A1A28"/>
        <stop offset="100%" stop-color="#2A2A3E"/>
      </radialGradient>
      <pattern id="chip-grid" width="18" height="18" patternUnits="userSpaceOnUse">
        <rect width="17" height="17" fill="none" stroke="#ffffff08" stroke-width="0.5"/>
      </pattern>
      <pattern id="pcb-grid" width="30" height="30" patternUnits="userSpaceOnUse">
        <rect width="29" height="29" fill="none" stroke="#00FF4406" stroke-width="0.5"/>
      </pattern>
      <radialGradient id="thermal-hot" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#FF6B35" stop-opacity="0.9"/>
        <stop offset="50%" stop-color="#FF6B35" stop-opacity="0.3"/>
        <stop offset="100%" stop-color="#FF6B35" stop-opacity="0"/>
      </radialGradient>
    </defs>

    <!-- ─── ACT I: Silicon particles SVG group ─── -->
    <g id="act1-svg" opacity="0">
      <!-- ambient radial -->
      <radialGradient id="amb1" cx="50%" cy="50%" r="55%">
        <stop offset="0%" stop-color="#FF6B35" stop-opacity="0.12"/>
        <stop offset="100%" stop-color="#050508" stop-opacity="0"/>
      </radialGradient>
      <rect id="amb1-rect" width="1440" height="900" fill="url(#amb1)"/>
      <!-- crosshair -->
      <line x1="720" y1="380" x2="720" y2="520" stroke="#FF6B3540" stroke-width="1"/>
      <line x1="640" y1="450" x2="800" y2="450" stroke="#FF6B3540" stroke-width="1"/>
      <circle cx="720" cy="450" r="40" fill="none" stroke="#FF6B3530" stroke-width="0.5" stroke-dasharray="4 4"/>
      <circle cx="720" cy="450" r="80" fill="none" stroke="#FF6B3518" stroke-width="0.5" stroke-dasharray="2 6"/>
    </g>

    <!-- ─── ACT II: Wafer ─── -->
    <g id="act2-svg" opacity="0">
      <radialGradient id="amb2" cx="50%" cy="50%" r="55%">
        <stop offset="0%" stop-color="#7B2FFF" stop-opacity="0.14"/>
        <stop offset="100%" stop-color="#050508" stop-opacity="0"/>
      </radialGradient>
      <rect width="1440" height="900" fill="url(#amb2)"/>
      <circle id="wafer-main" cx="720" cy="450" r="0" fill="url(#wafer-grad)" stroke="#ffffff15" stroke-width="1"/>
      <circle cx="720" cy="450" r="0" id="wafer-grid-circle" fill="url(#chip-grid)" opacity="0.6"/>
      <!-- orbital rings -->
      <ellipse id="orb1" cx="720" cy="450" rx="0" ry="0" stroke="#00D4FF40" stroke-width="1" fill="none"/>
      <ellipse id="orb2" cx="720" cy="450" rx="0" ry="0" stroke="#7B2FFF40" stroke-width="1" fill="none"/>
      <ellipse id="orb3" cx="720" cy="450" rx="0" ry="0" stroke="#00D4FF30" stroke-width="1" fill="none"/>
      <!-- tick marks around wafer -->
      <g id="wafer-ticks" opacity="0"></g>
    </g>

    <!-- ─── ACT III: Photolithography ─── -->
    <g id="act3-svg" opacity="0">
      <radialGradient id="amb3" cx="50%" cy="50%" r="60%">
        <stop offset="0%" stop-color="#7B2FFF" stop-opacity="0.18"/>
        <stop offset="100%" stop-color="#050508" stop-opacity="0"/>
      </radialGradient>
      <rect width="1440" height="900" fill="url(#amb3)"/>
      <g id="uv-beams"></g>
      <g id="uv-mask-circuits"></g>
    </g>

    <!-- ─── ACT IV: CPU Architecture ─── -->
    <g id="act4-svg" opacity="0">
      <radialGradient id="amb4" cx="50%" cy="50%" r="60%">
        <stop offset="0%" stop-color="#00D4FF" stop-opacity="0.10"/>
        <stop offset="100%" stop-color="#050508" stop-opacity="0"/>
      </radialGradient>
      <rect width="1440" height="900" fill="url(#amb4)"/>
      <g id="cpu-arch"></g>
    </g>

    <!-- ─── ACT V: Burn-in test ─── -->
    <g id="act5-svg" opacity="0">
      <radialGradient id="amb5" cx="50%" cy="50%" r="60%">
        <stop offset="0%" stop-color="#FF6B35" stop-opacity="0.15"/>
        <stop offset="100%" stop-color="#050508" stop-opacity="0"/>
      </radialGradient>
      <rect width="1440" height="900" fill="url(#amb5)"/>
      <g id="thermal-map"></g>
      <polyline id="osc-wave" fill="none" stroke="#00D4FF" stroke-width="2" points=""/>
    </g>

    <!-- ─── ACT VI: Packaging ─── -->
    <g id="act6-svg" opacity="0">
      <radialGradient id="amb6" cx="50%" cy="50%" r="55%">
        <stop offset="0%" stop-color="#C8A032" stop-opacity="0.12"/>
        <stop offset="100%" stop-color="#050508" stop-opacity="0"/>
      </radialGradient>
      <rect width="1440" height="900" fill="url(#amb6)"/>
      <g id="package-group"></g>
    </g>

    <!-- ─── ACT VII: Motherboard ─── -->
    <g id="act7-svg" opacity="0">
      <rect width="1440" height="900" fill="#0A150A"/>
      <rect width="1440" height="900" fill="url(#pcb-grid)"/>
      <g id="pcb-traces"></g>
      <g id="socket-group"></g>
    </g>

    <!-- ─── ACT VIII: Finale ─── -->
    <g id="act8-svg" opacity="0">
      <radialGradient id="amb8" cx="50%" cy="50%" r="65%">
        <stop offset="0%" stop-color="#00D4FF" stop-opacity="0.20"/>
        <stop offset="60%" stop-color="#7B2FFF" stop-opacity="0.10"/>
        <stop offset="100%" stop-color="#050508" stop-opacity="0"/>
      </radialGradient>
      <rect width="1440" height="900" fill="url(#amb8)"/>
      <g id="finale-ripples"></g>
      <g id="finale-cpu"></g>
    </g>
  </svg>

  <canvas id="mid-canvas" width="1440" height="900"></canvas>
  <div id="typo-layer"></div>
  <svg id="fg-layer" viewBox="0 0 1440 900" xmlns="http://www.w3.org/2000/svg">
    <!-- foreground crosshair coords -->
    <text x="30" y="40" fill="#ffffff15" font-size="10" font-family="'Courier New',monospace" letter-spacing="0.08em">1440×900 · 180s</text>
    <text id="fg-coords" x="1410" y="40" fill="#ffffff15" font-size="10" font-family="'Courier New',monospace" text-anchor="end" letter-spacing="0.08em">0.00s</text>
  </svg>

  <div id="act-overlay"></div>
  <div id="progress-bar"><div id="progress-tip"></div></div>
  <div id="counter">00:00 / 180s</div>
  <div id="controls">
    <button class="ctrl-btn" id="btn-replay">↺ بازپخش</button>
    <button class="ctrl-btn" id="btn-sound">♪ صدا</button>
  </div>
</div>

<script>
/* ════════════════════════════════════════════════════
   RESIZE HANDLER
════════════════════════════════════════════════════ */
const stage = document.getElementById('stage');
function resize(){
  const s = Math.min(window.innerWidth/1440, window.innerHeight/900);
  stage.style.transform = `translate(-50%,-50%) scale(${s})`;
}
resize();
window.addEventListener('resize', resize);

/* ════════════════════════════════════════════════════
   AUDIO ENGINE
════════════════════════════════════════════════════ */
let audioCtx = null;
let audioEnabled = false;

function initAudio(){
  if(audioCtx) return;
  audioCtx = new (window.AudioContext||window.webkitAudioContext)();
}

function masterGain(){
  const g = audioCtx.createGain();
  g.gain.value = audioEnabled ? 0.6 : 0;
  g.connect(audioCtx.destination);
  return g;
}

// Sub-bass impact
function playImpact(t=0){
  if(!audioCtx) return;
  const ct = audioCtx.currentTime + t;
  const osc = audioCtx.createOscillator();
  const filt = audioCtx.createBiquadFilter();
  const gain = audioCtx.createGain();
  osc.type='sine'; osc.frequency.setValueAtTime(90,ct);
  osc.frequency.exponentialRampToValueAtTime(32, ct+0.8);
  filt.type='lowpass'; filt.frequency.value=150;
  gain.gain.setValueAtTime(0,ct);
  gain.gain.linearRampToValueAtTime(0.4,ct+0.015);
  gain.gain.exponentialRampToValueAtTime(0.001,ct+1.2);
  osc.connect(filt); filt.connect(gain);
  const mg = masterGain(); gain.connect(mg);
  osc.start(ct); osc.stop(ct+1.5);
  // stereo warmth layer
  const osc2=audioCtx.createOscillator();
  osc2.type='sine';
  osc2.frequency.setValueAtTime(90*1.003,ct);
  osc2.frequency.exponentialRampToValueAtTime(32*1.003,ct+0.8);
  const g2=audioCtx.createGain();
  g2.gain.setValueAtTime(0,ct);
  g2.gain.linearRampToValueAtTime(0.15,ct+0.015);
  g2.gain.exponentialRampToValueAtTime(0.001,ct+1.0);
  osc2.connect(g2); g2.connect(mg);
  osc2.start(ct); osc2.stop(ct+1.3);
}

// Glass chime
function playChime(t=0){
  if(!audioCtx) return;
  const ct=audioCtx.currentTime+t;
  const freqs=[659,987,1318];
  freqs.forEach((f,i)=>{
    const osc=audioCtx.createOscillator();
    const bpf=audioCtx.createBiquadFilter();
    const gain=audioCtx.createGain();
    osc.type='sine'; osc.frequency.value=f;
    bpf.type='bandpass'; bpf.frequency.value=f; bpf.Q.value=8;
    gain.gain.setValueAtTime(0,ct+i*0.04);
    gain.gain.linearRampToValueAtTime(0.18-i*0.04,ct+i*0.04+0.005);
    gain.gain.exponentialRampToValueAtTime(0.001,ct+i*0.04+0.35);
    osc.connect(bpf); bpf.connect(gain); gain.connect(masterGain());
    osc.start(ct+i*0.04); osc.stop(ct+i*0.04+0.5);
  });
}

// Whoosh riser
function playWhoosh(t=0){
  if(!audioCtx) return;
  const ct=audioCtx.currentTime+t;
  const bufSize=audioCtx.sampleRate*0.8;
  const buf=audioCtx.createBuffer(1,bufSize,audioCtx.sampleRate);
  const data=buf.getChannelData(0);
  for(let i=0;i<bufSize;i++) data[i]=(Math.random()*2-1);
  const src=audioCtx.createBufferSource();
  src.buffer=buf;
  const filt=audioCtx.createBiquadFilter();
  filt.type='lowpass'; filt.frequency.setValueAtTime(200,ct);
  filt.frequency.linearRampToValueAtTime(1400,ct+0.4);
  filt.frequency.linearRampToValueAtTime(100,ct+0.8);
  const gain=audioCtx.createGain();
  gain.gain.setValueAtTime(0,ct);
  gain.gain.linearRampToValueAtTime(0.25,ct+0.1);
  gain.gain.exponentialRampToValueAtTime(0.001,ct+0.8);
  src.connect(filt); filt.connect(gain); gain.connect(masterGain());
  src.start(ct); src.stop(ct+0.9);
}

// Tick
function playTick(t=0){
  if(!audioCtx) return;
  const ct=audioCtx.currentTime+t;
  const osc=audioCtx.createOscillator();
  const gain=audioCtx.createGain();
  osc.type='square'; osc.frequency.value=4000;
  gain.gain.setValueAtTime(0.05,ct);
  gain.gain.exponentialRampToValueAtTime(0.001,ct+0.015);
  osc.connect(gain); gain.connect(masterGain());
  osc.start(ct); osc.stop(ct+0.02);
}

// Power-on swell
function playPowerOn(t=0){
  if(!audioCtx) return;
  const ct=audioCtx.currentTime+t;
  [110,220,330,440].forEach((f,i)=>{
    const osc=audioCtx.createOscillator();
    const gain=audioCtx.createGain();
    osc.type='sine'; osc.frequency.setValueAtTime(f*0.5,ct);
    osc.frequency.linearRampToValueAtTime(f,ct+0.8);
    gain.gain.setValueAtTime(0,ct+i*0.1);
    gain.gain.linearRampToValueAtTime(0.12,ct+i*0.1+0.4);
    gain.gain.exponentialRampToValueAtTime(0.001,ct+i*0.1+2.0);
    osc.connect(gain); gain.connect(masterGain());
    osc.start(ct+i*0.1); osc.stop(ct+i*0.1+2.2);
  });
}

/* ════════════════════════════════════════════════════
   BACKGROUND CANVAS — deep space particles
════════════════════════════════════════════════════ */
const bgCanvas = document.getElementById('bg-canvas');
const bgCtx = bgCanvas.getContext('2d');
const BG_STARS = [];
for(let i=0;i<300;i++){
  BG_STARS.push({
    x:Math.random()*1440, y:Math.random()*900,
    r:Math.random()*1.2+0.2, a:Math.random(),
    vx:(Math.random()-0.5)*0.08, vy:(Math.random()-0.5)*0.05,
    twinkle:Math.random()*Math.PI*2, twinkleSpeed:Math.random()*0.02+0.005
  });
}

function drawBg(t){
  bgCtx.clearRect(0,0,1440,900);
  // deep radial ambient
  const grad=bgCtx.createRadialGradient(720,450,0,720,450,700);
  grad.addColorStop(0,'rgba(0,212,255,0.04)');
  grad.addColorStop(0.5,'rgba(123,47,255,0.03)');
  grad.addColorStop(1,'rgba(5,5,8,0)');
  bgCtx.fillStyle=grad;
  bgCtx.fillRect(0,0,1440,900);

  BG_STARS.forEach(s=>{
    s.x+=s.vx; s.y+=s.vy;
    if(s.x<0)s.x=1440; if(s.x>1440)s.x=0;
    if(s.y<0)s.y=900; if(s.y>900)s.y=0;
    s.twinkle+=s.twinkleSpeed;
    const alpha=s.a*(0.5+0.5*Math.sin(s.twinkle));
    bgCtx.beginPath();
    bgCtx.arc(s.x,s.y,s.r,0,Math.PI*2);
    bgCtx.fillStyle=`rgba(240,244,255,${alpha})`;
    bgCtx.fill();
  });
}

/* ════════════════════════════════════════════════════
   MID CANVAS — per-act particles/waveforms
════════════════════════════════════════════════════ */
const midCanvas=document.getElementById('mid-canvas');
const midCtx=midCanvas.getContext('2d');

/* silicon particles for Act I */
const SI_PARTICLES=[];
for(let i=0;i<1800;i++){
  SI_PARTICLES.push({
    x:Math.random()*1440, y:Math.random()*900,
    ox:Math.random()*1440, oy:Math.random()*900,
    vx:0, vy:0, frozen:false,
    size:Math.random()*2+0.5,
    hue:Math.random()*30+10
  });
}

/* ════════════════════════════════════════════════════
   SVG HELPERS
════════════════════════════════════════════════════ */
const NS='http://www.w3.org/2000/svg';
function svgEl(tag,attrs){
  const el=document.createElementNS(NS,tag);
  for(const[k,v]of Object.entries(attrs)) el.setAttribute(k,v);
  return el;
}

/* Build wafer ticks */
function buildWaferTicks(){
  const g=document.getElementById('wafer-ticks');
  g.innerHTML='';
  for(let a=0;a<360;a+=3){
    const r1=285, r2=a%15===0?297:292;
    const rad=a*Math.PI/180;
    const x1=720+r1*Math.cos(rad), y1=450+r1*Math.sin(rad);
    const x2=720+r2*Math.cos(rad), y2=450+r2*Math.sin(rad);
    const line=svgEl('line',{
      x1,y1,x2,y2,
      stroke:a%15===0?'#ffffff30':'#ffffff15',
      'stroke-width':a%15===0?'1.5':'0.5'
    });
    g.appendChild(line);
  }
}
buildWaferTicks();

/* Build UV beams for Act III */
function buildUVBeams(){
  const g=document.getElementById('uv-beams');
  g.innerHTML='';
  for(let i=0;i<60;i++){
    const x=200+i*18;
    const line=svgEl('line',{
      x1:x,y1:-10,x2:x,y2:910,
      stroke:'#7B2FFF', 'stroke-width':'1',
      opacity:'0'
    });
    line.style.cssText=`transition:opacity 0.15s ${i*15}ms`;
    g.appendChild(line);
  }
}
buildUVBeams();

/* Build circuit paths for Act III */
function buildCircuits(){
  const g=document.getElementById('uv-mask-circuits');
  g.innerHTML='';
  const paths=[
    'M300,200 L400,200 L400,250 L500,250 L500,300',
    'M600,180 L700,180 L700,280 L650,280 L650,350',
    'M400,400 L500,400 L500,350 L600,350',
    'M800,200 L850,200 L850,300 L900,300 L900,250',
    'M750,400 L800,400 L800,450 L900,450',
    'M200,500 L300,500 L300,550 L400,550 L400,480',
    'M1000,300 L1050,300 L1050,380 L1100,380',
    'M950,180 L1000,180 L1000,220 L1050,220',
    'M1100,500 L1150,500 L1150,420 L1200,420',
    'M200,350 L250,350 L250,420 L320,420 L320,380',
  ];
  paths.forEach((d,i)=>{
    const total=300+Math.random()*200;
    const path=svgEl('path',{
      d, fill:'none', stroke:'#7B2FFF',
      'stroke-width':'1.5',
      'stroke-dasharray':total,
      'stroke-dashoffset':total,
      filter:'url(#glow-purple)'
    });

/* ════════════════════════════════════════════════════
   TYPOGRAPHY ENGINE
════════════════════════════════════════════════════ */
const typoLayer=document.getElementById('typo-layer');

function makeTypo({text,x,y,align='center',cls='t-hero',colorCls='',extraStyle='',id}){
  const wrap=document.createElement('div');
  wrap.className='typo-line';
  wrap.style.cssText=`left:${x}px;top:${y}px;${align==='center'?'transform:translateX(-50%)':''}`;
  if(id) wrap.id='typo-'+id;
  const inner=document.createElement('span');
  inner.className=`typo-inner ${cls} ${colorCls}`;
  inner.style.cssText=extraStyle;
  inner.textContent=text;
  wrap.appendChild(inner);
  typoLayer.appendChild(wrap);
  return {wrap,inner};
}

function revealTypo(inner, delay=0){
  setTimeout(()=>inner.classList.add('revealed'), delay);
}

function exitTypo(inner, delay=0){
  return new Promise(res=>{
    setTimeout(()=>{
      inner.classList.add('exited');
      setTimeout(res, 450);
    }, delay);
  });
}

function clearTypo(){
  typoLayer.innerHTML='';
}

/* tracking animation helper */
function animateTracking(el, fromEM, toEM, duration, ease='cubic-bezier(0.16,1,0.3,1)'){
  el.style.letterSpacing=`${fromEM}em`;
  el.style.transition=`letter-spacing ${duration}ms ${ease}`;
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    el.style.letterSpacing=`${toEM}em`;
  }));
}

/* counter number animation */
function animateCounter(el, from, to, duration, suffix=''){
  const start=performance.now();
  function upd(now){
    const p=Math.min((now-start)/duration,1);
    const v=Math.round(from+(to-from)*p);
    el.textContent=v+suffix;
    if(p<1) requestAnimationFrame(upd);
  }
  requestAnimationFrame(upd);
}

function fmt(s){
  const m=Math.floor(s/60);
  const sec=Math.floor(s%60);
  return `${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
}

/* SVG opacity transition helper */
function showSVGAct(id, dur=800){
  const el=document.getElementById(id);
  if(!el) return;
  el.style.transition=`opacity ${dur}ms cubic-bezier(0.16,1,0.3,1)`;
  el.style.opacity='1';
}
function hideSVGAct(id, dur=600){
  const el=document.getElementById(id);
  if(!el) return;
  el.style.transition=`opacity ${dur}ms cubic-bezier(0.7,0,0.84,0)`;
  el.style.opacity='0';
}

/* overlay flash */
function flashOverlay(color='#ffffff', dur=120){
  const ov=document.getElementById('act-overlay');
  ov.style.background=color;
  ov.style.transition='none';
  ov.style.opacity='1';
  setTimeout(()=>{
    ov.style.transition=`opacity ${dur}ms ease-out`;
    ov.style.opacity='0';
  },30);
}

function runAct8(){
  hideSVGAct('act7-svg',600);
  playWhoosh(0);
  flashOverlay('#00D4FF40',500);
  setTimeout(()=>{
    clearTypo();
    showSVGAct('act8-svg',800);
    buildFinaleRipples();
    playImpact(0.1);

    // Animate ripple rings
    const rings=document.querySelectorAll('[data-ripple-ring]');
    function animRipples(){
      const t=performance.now();
      rings.forEach((r,i)=>{
        const delay=parseInt(r.dataset.rippleDelay)||0;
        const phase=((t-delay)/2000)%1;
        const baseR=[100,200,320,460][i];
        r.setAttribute('r', baseR+phase*60);
        r.setAttribute('opacity', (1-phase)*0.5);
      });
      if(currentAct===8) requestAnimationFrame(animRipples);
    }
    requestAnimationFrame(animRipples);

    // exploding particles from center
    const finParts=[];
    for(let i=0;i<200;i++){
      const angle=Math.random()*Math.PI*2;
      const speed=1+Math.random()*4;
      const el=svgEl('circle',{r:2+Math.random()*2,fill:'#00D4FF',opacity:0.8});
      document.getElementById('finale-ripples').appendChild(el);
      finParts.push({el,x:720,y:450,vx:Math.cos(angle)*speed,vy:Math.sin(angle)*speed,life:1});
    }
    // purple + orange particles too
    for(let i=0;i<100;i++){
      const angle=Math.random()*Math.PI*2;
      const speed=0.5+Math.random()*3;
      const col=i<50?'#7B2FFF':'#FF6B35';
      const el=svgEl('circle',{r:1.5+Math.random(),fill:col,opacity:0.7});
      document.getElementById('finale-ripples').appendChild(el);
      finParts.push({el,x:720,y:450,vx:Math.cos(angle)*speed,vy:Math.sin(angle)*speed,life:1});
    }
    function animParts(){
      finParts.forEach(p=>{
        p.x+=p.vx; p.y+=p.vy;
        p.vx*=0.98; p.vy*=0.98;
        p.life-=0.004;
        p.el.setAttribute('cx',p.x);
        p.el.setAttribute('cy',p.y);
        p.el.setAttribute('opacity',Math.max(0,p.life));
      });
      if(currentAct===8) requestAnimationFrame(animParts);
    }
    requestAnimationFrame(animParts);

    // COMPUTE — scale-in
    const t1=makeTypo({text:'COMPUTE',x:720,y:280,cls:'t-hero',align:'center',extraStyle:'font-size:160px;letter-spacing:-0.055em;font-weight:900;opacity:0;transform:scale(4)'});
    setTimeout(()=>{
      t1.inner.style.transition='opacity 0.4s, transform 0.5s cubic-bezier(0.16,1,0.3,1)';
      t1.inner.style.opacity='1';
      t1.inner.style.transform='scale(1)';
      revealTypo(t1.inner);
      playImpact(0); playChime(0.15);
    },2000);

    const t2=makeTypo({text:'پردازنده',x:720,y:470,cls:'t-hero c-purple',align:'center',extraStyle:'letter-spacing:0.3em;opacity:0'});
    setTimeout(()=>{
      t2.inner.style.opacity='1';
      t2.inner.style.letterSpacing='0.3em';
      t2.inner.style.transition='letter-spacing 1.2s cubic-bezier(0.16,1,0.3,1), opacity 0.5s';
      requestAnimationFrame(()=>requestAnimationFrame(()=>{
        t2.inner.style.letterSpacing='-0.03em';
      }));
      playChime(0);
    },5000);

    // split reveal — ساخته شد
    const t3a=makeTypo({text:'ساخته',x:580,y:620,cls:'t-large c-orange',align:'right'});
    const t3b=makeTypo({text:'شد',x:780,y:620,cls:'t-large c-orange',align:'left'});
    setTimeout(()=>{
      // split from sides
      t3a.wrap.style.transform='translateX(-100px)';
      t3b.wrap.style.transform='translateX(100px)';
      t3a.inner.style.transition='all 0.6s cubic-bezier(0.16,1,0.3,1)';
      t3b.inner.style.transition='all 0.6s cubic-bezier(0.16,1,0.3,1)';
      revealTypo(t3a.inner);
      revealTypo(t3b.inner,80);
      setTimeout(()=>{
        t3a.wrap.style.transition='transform 0.6s cubic-bezier(0.16,1,0.3,1)';
        t3b.wrap.style.transition='transform 0.6s cubic-bezier(0.16,1,0.3,1)';
        t3a.wrap.style.transform='translateX(0)';
        t3b.wrap.style.transform='translateX(0)';
      },100);
      playImpact(0);
    },7000);

    // Final fade out at ~8.5s into act8 (total ~178s)
    setTimeout(()=>{
      const ov=document.getElementById('act-overlay');
      ov.style.background='#050508';
      ov.style.transition='opacity 1.5s ease-in';
      ov.style.opacity='1';
    },8500);
  },600);
}

/* ════════════════════════════════════════════════════
   BUS PARTICLE ANIMATION
════════════════════════════════════════════════════ */
function updateBusParticles(){
  if(currentAct!==4) return;
  busDataParticles.forEach(p=>{
    p.prog+=p.spd;
    if(p.prog>1) p.prog=0;
    const t=p.prog;
    const x=p.pts[0].x+(p.pts[1].x-p.pts[0].x)*t;
    const y=p.pts[0].y+(p.pts[1].y-p.pts[0].y)*t;
    p.dot.setAttribute('cx',x);
    p.dot.setAttribute('cy',y);
    p.dot.setAttribute('opacity',0.8);
  });
}

/* ════════════════════════════════════════════════════
   MAIN LOOP
════════════════════════════════════════════════════ */
let currentAct=0;

const ACT_TIMES=[
  {at:0,    fn:()=>{ currentAct=1; runAct1(); }},
  {at:22,   fn:()=>{ currentAct=2; runAct2(); }},
  {at:45,   fn:()=>{ currentAct=3; runAct3(); }},
  {at:70,   fn:()=>{ currentAct=4; runAct4(); }},
  {at:95,   fn:()=>{ currentAct=5; runAct5(); }},
  {at:118,  fn:()=>{ currentAct=6; runAct6(); }},
  {at:142,  fn:()=>{ currentAct=7; runAct7(); }},
  {at:170,  fn:()=>{ currentAct=8; runAct8(); }},
];

let lastTriggered=new Set();

function tick(now){
  if(!startTime) startTime=now;
  if(paused){ rafId=requestAnimationFrame(tick); return; }

  const elapsed=Math.min((now-startTime+elapsedPaused)/1000, TOTAL);
  const pct=elapsed/TOTAL;

  // update UI
  progressBar.style.width=(pct*100)+'%';
  counterEl.textContent=fmt(elapsed)+' / 180s';
  fgCoords.textContent=elapsed.toFixed(2)+'s';

  // trigger acts
  ACT_TIMES.forEach((act,i)=>{
    if(elapsed>=act.at && !lastTriggered.has(i)){
      lastTriggered.add(i);
      act.fn();
    }
  });

  // bg always running
  drawBg(elapsed);
  updateBusParticles();

  // animate silicon particles in act1
  if(currentAct===1){
    midCtx.clearRect(0,0,1440,900);
    let allFrozen=true;
    SI_PARTICLES.forEach(p=>{
      if(!p.frozen){
        allFrozen=false;
        const dx=720-p.x, dy=450-p.y;
        p.vx+=dx*0.0003;
        p.vy+=dy*0.0003;
        p.vx*=0.98; p.vy*=0.98;
        p.x+=p.vx; p.y+=p.vy;
        const dist=Math.sqrt(dx*dx+dy*dy);
        if(elapsed>18 && dist<5) p.frozen=true;
      }
      const alpha=elapsed>18?0.9:0.6+0.4*Math.sin(elapsed*2+p.x*0.01);
      midCtx.beginPath();
      midCtx.arc(p.x,p.y,p.size,0,Math.PI*2);
      midCtx.fillStyle=`hsla(${p.hue},90%,60%,${alpha})`;
      midCtx.fill();
    });
  } else if(currentAct!==1){
    midCtx.clearRect(0,0,1440,900);
  }

  if(elapsed>=TOTAL-0.05){
    // hold final frame, then loop after 3s
    setTimeout(restart, 3000);
    return;
  }

  rafId=requestAnimationFrame(tick);
}

function restart(){
  cancelAnimationFrame(rafId);
  clearAllTimeouts();
  clearTypo();
  currentAct=0;
  lastTriggered=new Set();
  busDataParticles=[];
  startTime=null;
  elapsedPaused=0;
  paused=false;

  // reset SVG acts
  ['act1-svg','act2-svg','act3-svg','act4-svg','act5-svg','act6-svg','act7-svg','act8-svg'].forEach(id=>{
    const el=document.getElementById(id);
    if(el){ el.style.transition='none'; el.style.opacity='0'; }
  });

  // reset overlay
  const ov=document.getElementById('act-overlay');
  ov.style.transition='none';
  ov.style.opacity='0';

  // reset wafer
  const wMain=document.getElementById('wafer-main');
  const wGrid=document.getElementById('wafer-grid-circle');
  const orb1=document.getElementById('orb1');
  const orb2=document.getElementById('orb2');
  const orb3=document.getElementById('orb3');
  [wMain,wGrid].forEach(el=>{ if(el){ el.style.transition='none'; el.setAttribute('r','0'); }});
  [orb1,orb2,orb3].forEach(el=>{ if(el){ el.setAttribute('rx','0'); el.setAttribute('ry','0'); }});

  progressBar.style.width='0%';
  midCtx.clearRect(0,0,1440,900);

  rafId=requestAnimationFrame(tick);
}

/* ════════════════════════════════════════════════════
   CONTROLS
════════════════════════════════════════════════════ */
document.getElementById('btn-replay').addEventListener('click',()=>{
  initAudio();
  if(audioCtx && audioCtx.state==='suspended') audioCtx.resume();
  restart();
});

document.getElementById('btn-sound').addEventListener('click',()=>{
  initAudio();
  if(audioCtx && audioCtx.state==='suspended') audioCtx.resume();
  audioEnabled=!audioEnabled;
  document.getElementById('btn-sound').textContent=audioEnabled?'✕ بی‌صدا':'♪ صدا';
});

document.addEventListener('keydown',(e)=>{
  if(e.code==='Space'){
    e.preventDefault();
    if(paused){
      startTime=performance.now();
      paused=false;
    } else {
      elapsedPaused+=performance.now()-startTime;
      paused=true;
    }
  }
  if(e.code==='KeyR') restart();
});

// First user gesture → init audio
document.addEventListener('click',()=>{ initAudio(); if(audioCtx&&audioCtx.state==='suspended') audioCtx.resume(); },{once:true});
document.addEventListener('keydown',()=>{ initAudio(); if(audioCtx&&audioCtx.state==='suspended') audioCtx.resume(); },{once:true});

/* ════════════════════════════════════════════════════
   PREFERS-REDUCED-MOTION
════════════════════════════════════════════════════ */
if(window.matchMedia('(prefers-reduced-motion: reduce)').matches){
  // static poster: show act8 state
  currentAct=8;
  showSVGAct('act8-svg',0);
  buildFinaleRipples();
  const t=makeTypo({text:'تولد پردازنده',x:720,y:420,cls:'t-hero',align:'center'});
  t.inner.classList.add('revealed');
} else {
  rafId=requestAnimationFrame(tick);
}
